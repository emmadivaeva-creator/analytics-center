<script>
(function(){
  function norm(v){return String(v||'').trim().toLowerCase()}
  function campaign(x){return String(x&&x.campaign||'').trim()}
  function isNews(x){
    const c=campaign(x);
    return /^Gosfinansi_letter_news_GF_digest(?:_|$)/i.test(c)||/^letter_news_goszakaz_regular_news_digest(?:_|$)/i.test(c);
  }
  function isActive(x){
    if(isNews(x))return false;
    const c=campaign(x);
    return norm(x&&x.segment)==='дожим демо'||/activdemo/i.test(c)||norm(x&&x.type)==='active';
  }
  window.isCanonicalNewsMail=isNews;
  window.mailType=function(x){if(isNews(x))return'news';if(isActive(x))return'active';return'direct'};
  function fix(){const p=document.querySelector('#newsView .head p');if(p)p.textContent='В NEWS попадают только штатные кампании Госфинансов Gosfinansi_letter_news_GF_digest и Госзаказа letter_news_goszakaz_regular_news_digest.'}
  const prev=window.renderAll;window.renderAll=function(){if(typeof prev==='function')prev();fix()};fix();
})();
</script>
