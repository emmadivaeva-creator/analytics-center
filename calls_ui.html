<style>
.calls-upload{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:linear-gradient(125deg,#17284a,#284b8d);color:#fff;border-radius:16px;padding:17px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.calls-upload.drag{outline:3px solid #86a8ff;outline-offset:2px}.calls-upload h2{margin:0;font-size:15px}.calls-upload p{margin:4px 0 0;color:#c3d0e7;font-size:10px}.calls-upload-actions{display:flex;align-items:center;gap:8px}.calls-upload label{background:#fff;color:#1c3768;border-radius:9px;padding:9px 12px;font-size:10px;font-weight:900;cursor:pointer}.calls-upload small{font-size:9px;color:#c3d0e7}
.calls-files{display:grid;gap:7px;margin-bottom:12px}.calls-file{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:12px;align-items:center}.calls-file b{font-size:10px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.calls-file span{font-size:9px;color:var(--muted)}.calls-progress{height:5px;background:#edf0f5;border-radius:999px;overflow:hidden;margin-top:5px}.calls-progress i{display:block;height:100%;background:var(--blue);width:0}.calls-file-result{text-align:right;font-size:9px!important;line-height:1.45}
.calls-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:10px}.calls-kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}.calls-kpi span{display:block;font-size:9px;color:var(--muted)}.calls-kpi strong{display:block;font-size:22px;letter-spacing:-.035em;margin-top:3px}.calls-kpi small{display:block;font-size:8px;color:var(--muted);margin-top:2px}
.calls-filter{display:grid;grid-template-columns:130px 155px 155px minmax(180px,1fr) 140px 140px auto;gap:7px;background:#fff;border:1px solid var(--line);padding:10px;border-radius:13px;margin-bottom:10px}.calls-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.calls-rank{padding:10px 17px 14px}.calls-rankrow{padding:10px 0;border-bottom:1px solid #edf0f5;cursor:pointer}.calls-rankrow:last-child{border-bottom:0}.calls-rankrow:hover b{color:var(--blue)}.calls-ranktop{display:flex;justify-content:space-between;gap:12px;align-items:center}.calls-ranktop b{font-size:11px}.calls-index{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:var(--green-soft);color:var(--green);white-space:nowrap}.calls-index.weak{background:var(--red-soft);color:#b53b46}.calls-index.low{background:#eef2f7;color:#617087}.calls-rankmeta{font-size:9px;color:var(--muted);margin-top:3px}.calls-rec{display:grid;gap:8px;padding:12px 17px 16px}.calls-recrow{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:11px;padding:10px 11px}.calls-recrow.weak{border-left-color:var(--red)}.calls-recrow.material{border-left-color:var(--blue)}.calls-recrow b{font-size:11px}.calls-recrow p{font-size:9px;color:var(--muted);margin:4px 0 0}.calls-ai{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:10px}.calls-ai b{font-size:11px}.calls-ai span{font-size:9px;color:var(--muted)}.calls-ai-actions{display:flex;gap:7px;align-items:center}.calls-ai input{width:220px}.calls-imports{padding:10px 17px 14px}.calls-import{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,70px);gap:8px;padding:9px 0;border-bottom:1px solid #edf0f5;align-items:center}.calls-import:last-child{border-bottom:0}.calls-import b{font-size:10px}.calls-import span{font-size:9px;color:var(--muted);text-align:right}.calls-detail-list{display:grid;gap:5px;margin-top:6px}.calls-detail-list div{font-size:10px;color:var(--muted);padding:6px 8px;background:#f7f9fc;border-radius:8px}.calls-fragment{font-size:10px;line-height:1.5;background:#f7f9fc;border-radius:9px;padding:9px;margin-top:6px}
@media(max-width:1100px){.calls-kpis{grid-template-columns:repeat(3,1fr)}.calls-filter{grid-template-columns:repeat(3,1fr)}.calls-grid{grid-template-columns:1fr}}
@media(max-width:700px){.calls-upload{grid-template-columns:1fr}.calls-upload-actions{justify-content:flex-start}.calls-kpis{grid-template-columns:1fr 1fr}.calls-filter{grid-template-columns:1fr}.calls-file{grid-template-columns:1fr}.calls-file-result{text-align:left!important}.calls-ai{display:block}.calls-ai-actions{margin-top:9px;flex-wrap:wrap}.calls-ai input{width:100%}.calls-import{grid-template-columns:1fr 1fr}.calls-import b{grid-column:1/-1}}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function(){
  const serviceBtn=document.querySelector('[data-view="service"]');
  const callsBtn=document.createElement('button');callsBtn.className='navbtn';callsBtn.dataset.view='calls';callsBtn.textContent='Звонки / Что продает';
  if(serviceBtn)serviceBtn.before(callsBtn);else document.querySelector('#nav').appendChild(callsBtn);
  const section=document.createElement('section');section.className='view';section.id='callsView';section.innerHTML=`
    <div class="head"><div><div class="eyebrow">Звонки</div><h1>Что реально продает в презентациях</h1><p>Загружаем очередной Excel, история накапливается сама. Дубли не размножаются, измененные звонки обновляются, смысловая разметка дозаполняется отдельно.</p></div><div class="week" id="callsPeriod">—</div></div>
    <div class="calls-upload" id="callsDrop"><div><h2>Перетащите Excel сюда</h2><p>Или выберите один или несколько .xlsx. Конвертировать в Google Sheets не нужно.</p></div><div class="calls-upload-actions"><label for="callsFiles">Загрузить Excel</label><input class="hidden" id="callsFiles" type="file" multiple accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><small>.xlsx</small></div></div>
    <div class="calls-files hidden" id="callsFileList"></div>
    <div class="calls-ai" id="callsAiBox"></div>
    <div class="calls-kpis" id="callsKpis"></div>
    <div class="calls-filter">
      <select class="control" id="callsDirection"><option value="">ГФ + ГЗ</option><option value="ГЗ">Только ГЗ</option><option value="ГФ">Только ГФ</option></select>
      <select class="control" id="callsFamily"><option value="">Все продукты</option><option value="Система">Система</option><option value="Периодика">Периодика</option><option value="Академия">Академия</option></select>
      <select class="control" id="callsMonth"><option value="">Все месяцы</option></select>
      <select class="control" id="callsGroup"><option value="">Все издательские группы</option></select>
      <select class="control" id="callsSale"><option value="">Продажа + без продажи</option><option value="sale">Только с продажей</option><option value="no-sale">Только без продажи</option></select>
      <select class="control" id="callsMin"><option value="3">Мин. 3 звонка</option><option value="5" selected>Мин. 5 звонков</option><option value="10">Мин. 10 звонков</option><option value="20">Мин. 20 звонков</option></select>
      <button class="softbtn" id="callsReset">Сбросить</button>
    </div>
    <div class="calls-grid">
      <section class="panel"><div class="panelhead"><h2>Что продает</h2><p>Темы, которые встречаются в успешных звонках непропорционально чаще. Редкие темы не объявляем победителями.</p></div><div class="calls-rank" id="callsTopTopics"></div></section>
      <section class="panel"><div class="panelhead"><h2>Какие материалы продают</h2><p>Конкретные статьи, уроки, сервисы, шаблоны и инструменты, если они распознаны в звонках.</p></div><div class="calls-rank" id="callsTopMaterials"></div></section>
      <section class="panel"><div class="panelhead"><h2>Что продает хуже</h2><p>Темы показывают достаточно часто, но продажи рядом с ними встречаются реже среднего.</p></div><div class="calls-rank" id="callsWeak"></div></section>
      <section class="panel"><div class="panelhead"><h2>Что взять редакции</h2><p>Переводим звонки в решения для DEMO, active-demo, постов и обучения менеджеров.</p></div><div class="calls-rec" id="callsRecommendations"></div></section>
    </div>
    <section class="panel" style="margin-top:10px"><div class="panelhead"><h2>Последние загрузки</h2><p>Сколько строк добавилось, обновилось и сколько дублей было пропущено.</p></div><div class="calls-imports" id="callsImports"></div></section>`;
  const serviceView=document.querySelector('#serviceView');if(serviceView)serviceView.before(section);else document.querySelector('#app').appendChild(section);

  let callsData=null,callsBusy=false;
  const cf=s=>document.querySelector(s);
  function callsFilters(){return{direction:cf('#callsDirection').value,family:cf('#callsFamily').value,month:cf('#callsMonth').value,group:cf('#callsGroup').value,sale:cf('#callsSale').value,minSample:Number(cf('#callsMin').value||5)}}
  async function loadCalls(){if(!apps()||callsBusy)return;callsBusy=true;try{callsData=await server('getCallsData',callsFilters());renderCalls()}catch(e){toast(e.message||String(e))}finally{callsBusy=false}}
  function renderCalls(){const d=callsData;if(!d)return;cf('#callsPeriod').textContent=d.meta.period||'—';cf('#callsKpis').innerHTML=[['Загружено звонков',fmt.format(d.meta.total),'в текущем фильтре'],['С продажей',fmt.format(d.meta.sales),pct.format(d.meta.saleRate)+'% базы'],['Разобрано',fmt.format(d.meta.analyzed),`ожидает: ${fmt.format(d.meta.pending)}`],['Тем распознано',fmt.format(d.meta.topicCount),'смысловая разметка'],['Последняя загрузка',d.meta.lastImport?dtRu(d.meta.lastImport):'—','история сохраняется']].map(x=>`<div class="calls-kpi"><span>${x[0]}</span><strong>${esc(x[1])}</strong><small>${esc(x[2])}</small></div>`).join('');
    fillSelect('#callsMonth',d.filters.months,'Все месяцы');fillSelect('#callsGroup',d.filters.groups,'Все издательские группы');
    cf('#callsTopTopics').innerHTML=rankCalls(d.topTopics,'Тема',false);cf('#callsTopMaterials').innerHTML=rankCalls(d.topMaterials,'Материал',false);cf('#callsWeak').innerHTML=rankCalls(d.weakTopics,'Тема',true);
    cf('#callsRecommendations').innerHTML=d.recommendations.length?d.recommendations.map(x=>`<div class="calls-recrow ${x.type==='weak'?'weak':x.type==='material'?'material':''}"><b>${esc(x.title)}</b><p>${esc(x.text)} · индекс ${pct.format(x.index)} · ${x.calls} звонков</p></div>`).join(''):'<div class="empty"><b>Пока нечего рекомендовать</b>Сначала нужна смысловая разметка звонков.</div>';
    cf('#callsImports').innerHTML=d.imports.length?d.imports.map(x=>`<div class="calls-import"><b>${esc(x.fileName||'Файл')}</b><span>строк ${fmt.format(x.rowsRead)}</span><span>+${fmt.format(x.added)} новых</span><span>${fmt.format(x.updated)} обновл.</span><span>${fmt.format(x.duplicates)} дублей</span></div>`).join(''):'<div class="empty"><b>Загрузок еще не было</b>Первый Excel появится здесь.</div>';renderCallsAi();
  }
  function fillSelect(sel,items,first){const el=cf(sel),current=el.value;el.innerHTML=`<option value="">${first}</option>`+(items||[]).map(x=>`<option value="${attr(x)}">${esc(x)}</option>`).join('');if([...el.options].some(o=>o.value===current))el.value=current}
  function rankCalls(rows,kind,weak){return rows&&rows.length?rows.map(x=>`<div class="calls-rankrow" data-call-topic="${attr(x.name)}" data-call-kind="${kind}"><div class="calls-ranktop"><b>${esc(x.name)}</b><span class="calls-index ${x.lowSample?'low':weak?'weak':''}">${x.lowSample?'мало данных':'индекс '+pct.format(x.index)}</span></div><div class="calls-rankmeta">${fmt.format(x.calls)} звонков · ${fmt.format(x.sales)} с продажей · продажа в ${pct.format(x.saleRate)}%</div></div>`).join(''):'<div class="empty"><b>Пока нет устойчивого сигнала</b>Нужно больше разобранных звонков или мягче порог выборки.</div>'}
  function renderCallsAi(){const m=callsData.meta;if(m.gptConfigured){cf('#callsAiBox').innerHTML=`<div><b>Смысловой анализ подключен</b><br><span>Разобрано ${fmt.format(m.analyzed)}. В очереди ${fmt.format(m.pending)}. Модель: ${esc(m.model)}</span></div><div class="calls-ai-actions"><button class="primary" id="callsAnalyze">Разобрать еще</button></div>`;cf('#callsAnalyze').onclick=analyzeMore}else{cf('#callsAiBox').innerHTML=`<div><b>Базовая статистика уже работает. Для тем и материалов нужен GPT-анализ.</b><br><span>Ключ сохраняется только в Script Properties на сервере, в код сайта он не попадет.</span></div><div class="calls-ai-actions"><input class="control" id="callsApiKey" type="password" placeholder="OpenAI API key"><button class="primary" id="callsSaveKey">Подключить анализ</button></div>`;cf('#callsSaveKey').onclick=saveKey}}
  async function saveKey(){const key=cf('#callsApiKey').value.trim();if(!key)return toast('Вставьте API-ключ');callsBusy=true;try{await server('saveCallsOpenAIKey',key);toast('Анализ подключен');await loadCalls()}catch(e){toast(e.message||String(e))}finally{callsBusy=false}}
  async function analyzeMore(){if(callsBusy)return;callsBusy=true;try{let total=0,last=null;for(let i=0;i<3;i++){last=await server('analyzeCallsBatch',4);total+=Number(last.analyzed||0);if(!last.pending||!last.analyzed)break}toast(`Разобрано еще: ${total}`);callsData=await server('getCallsData',callsFilters());renderCalls()}catch(e){toast(e.message||String(e))}finally{callsBusy=false}}

  function normHead(v){return String(v||'').toLowerCase().replace(/ё/g,'е').replace(/[_–—-]+/g,' ').replace(/[^a-zа-я0-9]+/gi,' ').replace(/\s+/g,' ').trim()}
  function detectHeaders(headers){const h=headers.map(normHead),has=x=>h.includes(normHead(x)),trans=h.some(x=>x==='анализ расшифровка звонков'||x.includes('расшифровка звонков')),action=has('номер действия'),sl=h.some(x=>x==='sl api nr');if(!trans||!action||!sl)return null;if(h.some(x=>x==='кол во продаж'||x.includes('кол во продаж')))return'sales';if(has('год')||has('полугодие'))return'all';return'all'}
  function getVal(row,map,aliases){for(const a of aliases){const k=normHead(a);if(map[k]!=null)return row[map[k]]}return''}
  function parseSheet(sheet){const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});let headerRow=-1,type=null;for(let i=0;i<Math.min(25,matrix.length);i++){type=detectHeaders(matrix[i]||[]);if(type){headerRow=i;break}}if(headerRow<0)return null;const headers=(matrix[headerRow]||[]).map(normHead),map={};headers.forEach((h,i)=>{if(h&&!Object.prototype.hasOwnProperty.call(map,h))map[h]=i});const records=[];for(let i=headerRow+1;i<matrix.length;i++){const r=matrix[i]||[],action=getVal(r,map,['Номер действия']),sl=getVal(r,map,['sl_api_nr']);if(!String(action).trim()&&!String(sl).trim())continue;const sales=getVal(r,map,['Кол-во продаж','Количество продаж']);records.push({year:getVal(r,map,['Год']),half:getVal(r,map,['Полугодие']),month:getVal(r,map,['Месяц']),product:getVal(r,map,['Тип головного продукта']),group:getVal(r,map,['Издательская группа']),actionNo:action,slApiNr:sl,salesCount:sales,sale:type==='sales'?(String(sales).trim()?Number(String(sales).replace(',','.'))>0:true):false,transcript:getVal(r,map,['Анализ - Расшифровка звонков','Анализ Расшифровка звонков']),sourceError:getVal(r,map,['Ошибка'])})}return{type,records,headers:matrix[headerRow]}}
  async function parseFile(file){if(!window.XLSX)throw new Error('Не загрузилась библиотека чтения XLSX. Обновите страницу.');const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),parts=[];for(const name of wb.SheetNames){const p=parseSheet(wb.Sheets[name]);if(p)parts.push(p)}if(!parts.length){const first=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(first,{header:1,defval:'',raw:false}),found=(rows.slice(0,10).find(r=>r.some(Boolean))||[]).map(String);throw new Error('Структура не распознана. Найдены колонки: '+found.join(' | ')+'. Нужны минимум: Номер действия, sl_api_nr, Анализ - Расшифровка звонков; для файла продаж также Кол-во продаж.')}const type=parts.some(x=>x.type==='sales')?'sales':'all';return{type,records:parts.flatMap(x=>x.records)}}
  function fileCard(file,i){return `<div class="calls-file" id="callsFile${i}"><div><b>${esc(file.name)}</b><span>${(file.size/1024/1024).toFixed(1)} МБ · ожидает обработки</span><div class="calls-progress"><i></i></div></div><span class="calls-file-result">—</span></div>`}
  async function uploadCallFiles(files){files=[...files].filter(f=>/\.xlsx$/i.test(f.name));if(!files.length)return toast('Нужен файл .xlsx');if(!apps())return toast('Загрузка работает в Apps Script');cf('#callsFileList').classList.remove('hidden');cf('#callsFileList').innerHTML=files.map(fileCard).join('');for(let i=0;i<files.length;i++){const file=files[i],card=cf('#callsFile'+i),label=card.querySelector('span'),bar=card.querySelector('.calls-progress i'),result=card.querySelector('.calls-file-result');try{label.textContent='читаем Excel…';bar.style.width='8%';const parsed=await parseFile(file);label.textContent=`${parsed.type==='sales'?'звонки с продажами':'общие расшифровки'} · ${parsed.records.length} строк`;const batch=await server('beginCallsImport',{fileName:file.name,fileSize:file.size,fileType:parsed.type,rowsRead:parsed.records.length});let added=0,updated=0,duplicates=0,errors=0;for(let pos=0;pos<parsed.records.length;pos+=300){const chunk=parsed.records.slice(pos,pos+300),r=await server('importCallsBatch',{batchId:batch.batchId,fileName:file.name,records:chunk});added+=Number(r.added||0);updated+=Number(r.updated||0);duplicates+=Number(r.duplicates||0);errors+=Number(r.errors||0);bar.style.width=Math.round(Math.min(95,(pos+chunk.length)/Math.max(1,parsed.records.length)*90+8))+'%'}await server('finishCallsImport',{batchId:batch.batchId,rowsRead:parsed.records.length});bar.style.width='100%';result.innerHTML=`<b>Готово</b><br>+${added} новых · ${updated} обновл. · ${duplicates} дублей${errors?` · ${errors} ошибок`:''}`;label.textContent=`${parsed.type==='sales'?'с продажами':'общие'} · ${parsed.records.length} строк`}catch(e){bar.style.width='100%';bar.style.background='var(--red)';result.innerHTML='<b>Ошибка</b><br>'+esc(e.message||e)}}await loadCalls();if(callsData&&callsData.meta.gptConfigured&&callsData.meta.pending){try{await server('analyzeCallsBatch',4);await loadCalls()}catch(e){}}}

  async function openTopic(name,kind){try{const d=await server('getCallTopicDetail',name,kind,callsFilters());cf('#drawerMeta').textContent=`${kind} · ${d.calls} звонков · ${d.sales} продаж`;cf('#drawerTitle').textContent=d.name;const list=(title,items)=>items&&items.length?`<div class="dsection"><h3>${title}</h3><div class="calls-detail-list">${items.map(x=>`<div>${esc(x.name)} <b>${x.count}</b></div>`).join('')}</div></div>`:'';const fr=(title,items)=>items&&items.length?`<div class="dsection"><h3>${title}</h3>${items.map(x=>`<div class="calls-fragment">${esc(x)}</div>`).join('')}</div>`:'';cf('#drawerBody').innerHTML=`<div class="drawerstats"><div class="dstat"><span>Звонков</span><b>${d.calls}</b></div><div class="dstat"><span>С продажей</span><b>${d.sales}</b></div><div class="dstat"><span>Индекс связи</span><b>${pct.format(d.salesIndex)}</b></div></div><div class="dsection"><h3>Вывод</h3><p>${esc(d.recommendation)}</p></div>${list('По продуктам',d.products)}${list('С какими материалами идет вместе',d.coMaterials)}${list('Боли клиента',d.pains)}${list('Приемы презентации',d.techniques)}${fr('Фрагменты успешных звонков',d.successfulFragments)}${fr('Для сравнения: без продажи',d.unsuccessfulFragments)}`;cf('#drawerBack').classList.add('open');cf('#drawer').classList.add('open')}catch(e){toast(e.message||String(e))}}

  callsBtn.addEventListener('click',()=>{if(!callsData)loadCalls()});
  section.addEventListener('click',e=>{const r=e.target.closest('[data-call-topic]');if(r)openTopic(r.dataset.callTopic,r.dataset.callKind)});
  ['#callsDirection','#callsFamily','#callsMonth','#callsGroup','#callsSale','#callsMin'].forEach(s=>cf(s).addEventListener('change',loadCalls));
  cf('#callsReset').onclick=()=>{['#callsDirection','#callsFamily','#callsMonth','#callsGroup','#callsSale'].forEach(s=>cf(s).value='');cf('#callsMin').value='5';loadCalls()};
  cf('#callsFiles').onchange=e=>uploadCallFiles(e.target.files);const drop=cf('#callsDrop');['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>uploadCallFiles(e.dataTransfer.files));
  const topRefresh=cf('#refreshTop');if(topRefresh)topRefresh.addEventListener('click',()=>{if(callsData)setTimeout(loadCalls,500)});
  if(location.hash==='#calls'){switchView('calls');loadCalls()}
})();
</script>
