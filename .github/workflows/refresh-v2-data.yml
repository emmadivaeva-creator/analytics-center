name: Refresh Analytics Center V2 (scheduled)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v2-data.yml'
  schedule:
    - cron: '12 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics-v2-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-rebuild
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh live demand, pulse, and news snapshots
        run: node .github/scripts/refresh-live-snapshots.mjs
      - name: Validate output
        run: |
          node -e "const p=require('./pulse-current.json'); if(!Array.isArray(p.products)||p.products.length!==6)process.exit(1)"
          node -e "const d=require('./demand-current.json'); if(!Array.isArray(d.evidence)||!d.evidence.length)process.exit(1)"
          node -e "const n=require('./news-demo-current.json'); if(!Array.isArray(n.topics))process.exit(1)"
      - name: Publish changed snapshots to V2
        run: |
          if git diff --quiet -- pulse-current.json demand-current.json news-demo-current.json; then
            echo "Snapshots unchanged"
            exit 0
          fi
          git config user.name "analytics-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pulse-current.json demand-current.json news-demo-current.json
          git commit -m "Refresh scheduled analytics snapshots [skip ci]"
          git push origin HEAD:v2-rebuild
