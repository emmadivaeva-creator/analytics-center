name: V2 static assets
on:
  push:
    branches: [v2-rebuild]
    paths: ['.github/workflows/v2-static-assets.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-rebuild
      - name: Extract CSS and JS from index
        shell: python
        run: |
          import re, json
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v2-pages-bridge-2026-09-09-08','v2-static-assets-2026-09-09-09')
          css=re.search(r'<style>(.*?)</style>',s,re.S).group(1).strip()
          body=re.search(r'<body>(.*)<script>',s,re.S).group(1).strip()
          script=re.findall(r'<script>(.*?)</script>',s,re.S)[-1].strip()
          appjs="document.addEventListener('DOMContentLoaded',function(){\n  document.body.innerHTML="+json.dumps(body,ensure_ascii=False)+";\n"+script+"\n});\n"
          Path('app.css').write_text(css+'\n',encoding='utf-8')
          Path('app.js').write_text(appjs,encoding='utf-8')
          p.write_text(s,encoding='utf-8')
      - name: Commit assets
        run: |
          git config user.name "analytics-center-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.css app.js .nojekyll
          git commit -m "Publish V2 frontend as live CSS and JS assets"
          git push origin v2-rebuild
