name: Verify published mail archive
on:
  push:
    branches: [fix/mail-letter-render-20261016]
    paths: ['.github/workflows/verify-published-mail.yml']
permissions:
  contents: read
jobs:
  live-read:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Prepare browser
        run: npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.56.1
      - name: Load published mail archive without signing in or changing source data
        env:
          NODE_PATH: ${{ runner.temp }}/browser/node_modules
        run: |
          node <<'JS'
          'use strict';
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
           const page=await browser.newPage();
           const errors=[];
           page.on('pageerror',e=>errors.push(e.message));
           await page.addInitScript(()=>{
            window.__mailReadProof=[];
            let rpc;
            Object.defineProperty(window,'analyticsRpc',{
             configurable:true,
             get(){return rpc;},
             set(original){rpc=async function(method,...args){
              const started=Date.now();
              try{
               const result=await original.apply(this,[method,...args]);
               if(method==='getMailRegistryPageUi')window.__mailReadProof.push({offset:args[0],returnedEmails:result.emails?.length,totalRows:result.totalRows,nextOffset:result.nextOffset,done:result.done,seconds:(Date.now()-started)/1000});
               return result;
              }catch(e){
               if(method==='getMailRegistryPageUi')window.__mailReadProof.push({offset:args[0],error:e.message,seconds:(Date.now()-started)/1000});
               throw e;
              }
             };}
            });
           });
           let result;
           try{
            const url='https://emmadivaeva-creator.github.io/analytics-center/';
            let published=false;
            for(let i=0;i<20;i++){
             const probe=await page.request.get(url+'?verify='+Date.now());
             if(probe.ok()&&(await probe.text()).includes('20261016-mail-render-01')){published=true;break;}
             await page.waitForTimeout(5000);
            }
            assert(published,'New bootstrap version is not yet published');
            const response=await page.goto(url+'?v=20261016-mail-render-01#mail',{waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(response.status(),200);
            await page.locator('.app').waitFor({timeout:30000});
            const bootstrap=await page.locator('script[src*="domain-auth.js"]').getAttribute('src');
            assert(bootstrap.includes('20261016-mail-render-01'),'Published page must contain the repaired bootstrap version');
            await page.waitForFunction(()=>document.querySelectorAll('#mailRows tbody tr').length>0||/^Не удалось/.test(document.querySelector('#mailStatus')?.textContent||''),{},{timeout:660000});
            await page.waitForTimeout(1200);
            result=await page.evaluate(()=>({mailStatus:document.querySelector('#mailStatus')?.textContent,renderedRows:document.querySelectorAll('#mailRows tbody tr').length,completedPages:window.__mailReadProof,bootstrap:document.querySelector('script[src*="domain-auth.js"]')?.getAttribute('src')}));
            result.errors=errors;
            result.ok=result.renderedRows>0&&result.completedPages.some(x=>x.done===true)&&errors.length===0;
            assert(result.ok,'Cold browser did not finish the entire mail archive and render rows');
            result.cache=await page.evaluate(()=>new Promise(resolve=>{
             const request=indexedDB.open('analytics-center-cache',1);
             request.onerror=()=>resolve({error:'IndexedDB open failed'});
             request.onsuccess=()=>{
              const db=request.result;
              const tx=db.transaction('kv','readonly');
              const get=tx.objectStore('kv').get('mail-registry-v7');
              get.onsuccess=()=>{const x=get.result;resolve({savedEmails:x?.emails?.length,savedAt:x?.savedAt});db.close();};
              get.onerror=()=>{resolve({error:'Cache read failed'});db.close();};
             };
            }));
           }catch(e){
            result=result||await page.evaluate(()=>({mailStatus:document.querySelector('#mailStatus')?.textContent,renderedRows:document.querySelectorAll('#mailRows tbody tr').length,completedPages:window.__mailReadProof||[]})).catch(()=>({}));
            result.ok=false;result.error=e.message;result.errors=errors;process.exitCode=1;
           }finally{
            result.checkedAt=new Date().toISOString();
            fs.writeFileSync('live-mail-proof.json',JSON.stringify(result,null,2));
            console.log('LIVE_MAIL_PROOF',JSON.stringify(result));
            await browser.close();
           }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-mail-proof
          retention-days: 3
          path: live-mail-proof.json
