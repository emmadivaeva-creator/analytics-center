name: One-shot runtime cleanup maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-remove-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Move required runtime fixes into canonical files
        run: |
          python - <<'PY'
          from pathlib import Path

          code = Path('Code.gs')
          text = code.read_text(encoding='utf-8')
          old = """function canAdmin_() {\n  const props = PropertiesService.getScriptProperties();\n  const admin = (props.getProperty(APP.adminProperty) || '').toLowerCase();\n  const active = (Session.getActiveUser().getEmail() || '').toLowerCase();\n  return Boolean(admin && active && admin === active);\n}\n"""
          new = """function canAdmin_() {\n  const props = PropertiesService.getScriptProperties();\n  let admin = String(props.getProperty(APP.adminProperty) || '').toLowerCase();\n  const active = String(Session.getActiveUser().getEmail() || '').toLowerCase();\n  const effective = String(Session.getEffectiveUser().getEmail() || '').toLowerCase();\n  const viewer = active || effective;\n\n  if (!admin && effective) {\n    props.setProperty(APP.adminProperty, effective);\n    admin = effective;\n  }\n\n  return Boolean(admin && viewer && admin === viewer);\n}\n"""
          if old not in text:
              if new not in text:
                  raise SystemExit('Canonical canAdmin_ block not found')
          else:
              text = text.replace(old, new, 1)
          code.write_text(text, encoding='utf-8')

          calls = Path('Calls.gs')
          c = calls.read_text(encoding='utf-8')
          old_sheet = """  const sheet = storage.getSheetByName(CALLS_CFG.rawSheet);\n  const values = sheet.getDataRange().getValues();\n"""
          new_sheet = """  const sheet = storage.getSheetByName(CALLS_CFG.rawSheet);\n  callsEnsureRawCapacity_(sheet, rows.length);\n  const values = sheet.getDataRange().getValues();\n"""
          if old_sheet not in c:
              if new_sheet not in c:
                  raise SystemExit('Calls import sheet block not found')
          else:
              c = c.replace(old_sheet, new_sheet, 1)

          marker = """function callsEnsureSheets_(storage) {\n  callsEnsureSheet_(storage, CALLS_CFG.rawSheet, CALLS_RAW_HEADERS, true);\n  callsEnsureSheet_(storage, CALLS_CFG.analysisSheet, CALLS_ANALYSIS_HEADERS, true);\n  callsEnsureSheet_(storage, CALLS_CFG.topicsSheet, CALLS_TOPIC_HEADERS, true);\n  callsEnsureSheet_(storage, CALLS_CFG.importsSheet, CALLS_IMPORT_HEADERS, true);\n}\n"""
          replacement = marker + """\nfunction callsEnsureRawCapacity_(sheet, incomingRows) {\n  const needRows = Math.max(2, sheet.getLastRow() + Math.max(0, Number(incomingRows || 0)) + 25);\n  if (sheet.getMaxRows() < needRows) {\n    sheet.insertRowsAfter(sheet.getMaxRows(), needRows - sheet.getMaxRows());\n  }\n  return sheet;\n}\n"""
          if 'function callsEnsureRawCapacity_' not in c:
              if marker not in c:
                  raise SystemExit('callsEnsureSheets_ marker not found')
              c = c.replace(marker, replacement, 1)

          old_norm = """function callsNormalizeRecord_(raw, sourceFile, batchId) {\n  const actionNo = callsClean_(raw.actionNo);\n  const slApiNr = callsNormalizeSl_(raw.slApiNr);\n  const sale = raw.sale === true || String(raw.sale).toLowerCase() === 'true' || Number(raw.salesCount || 0) > 0;\n  const record = {\n"""
          new_norm = """function callsNormalizeRecord_(raw, sourceFile, batchId) {\n  const actionNo = callsClean_(raw.actionNo);\n  const slApiNr = callsNormalizeSl_(raw.slApiNr);\n  const sale = raw.sale === true || String(raw.sale).toLowerCase() === 'true' || Number(raw.salesCount || 0) > 0;\n  let transcript = String(raw.transcript || '').replace(/\\u0000/g,'').trim();\n  if (transcript.length > 45000) {\n    transcript = transcript.slice(0, 45000) + '\\n[Расшифровка обрезана при импорте: превышен лимит ячейки Google Sheets]';\n  }\n  const record = {\n"""
          if old_norm not in c:
              if new_norm not in c:
                  raise SystemExit('callsNormalizeRecord_ start not found')
          else:
              c = c.replace(old_norm, new_norm, 1)

          old_transcript = """    transcript: String(raw.transcript || '').replace(/\\u0000/g,'').trim(),\n"""
          if old_transcript in c:
              c = c.replace(old_transcript, """    transcript: transcript,\n""", 1)
          elif '    transcript: transcript,' not in c:
              raise SystemExit('Transcript assignment not found')

          calls.write_text(c, encoding='utf-8')
          PY

          git rm zz_runtime_fix.gs

      - name: Verify runtime cleanup
        run: |
          test ! -e zz_runtime_fix.gs
          grep -q "function callsEnsureRawCapacity_" Calls.gs
          grep -q "transcript.length > 45000" Calls.gs
          grep -q "const viewer = active || effective" Code.gs

      - name: Commit canonical cleanup
        run: |
          git config user.name "analytics-center-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Move runtime fixes into canonical modules"
          git push
