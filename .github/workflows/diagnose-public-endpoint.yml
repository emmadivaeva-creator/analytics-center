name: Diagnose public Apps Script endpoint
on:
  push:
    branches: [v2-rebuild]
    paths:
      - '.github/workflows/diagnose-public-endpoint.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Health JSON
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbzseFMx8oDQPQ0BtUu6rvZiGAdZRFX6-uR2q9bqFF69olKK2pgvl_dGLJ6bC3MPLVcn7g/exec?method=v2HealthCheck&args=%5B%5D'
          BODY="$(curl -L --fail --silent --show-error --max-time 30 "$URL")"
          echo "$BODY" | grep -q '"ok":true'
      - name: Health JSONP
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbzseFMx8oDQPQ0BtUu6rvZiGAdZRFX6-uR2q9bqFF69olKK2pgvl_dGLJ6bC3MPLVcn7g/exec?method=v2HealthCheck&args=%5B%5D&callback=analyticsJsonp_Test1'
          BODY="$(curl -L --fail --silent --show-error --max-time 30 "$URL")"
          echo "$BODY" | grep -q '^analyticsJsonp_Test1('
      - name: Pulse public read
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbzseFMx8oDQPQ0BtUu6rvZiGAdZRFX6-uR2q9bqFF69olKK2pgvl_dGLJ6bC3MPLVcn7g/exec?method=getPulseDataFresh&args=%5B%5D'
          BODY="$(curl -L --fail --silent --show-error --max-time 60 "$URL")"
          echo "$BODY" | grep -q '"ok":true'
      - name: Mail page public read
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbzseFMx8oDQPQ0BtUu6rvZiGAdZRFX6-uR2q9bqFF69olKK2pgvl_dGLJ6bC3MPLVcn7g/exec?method=getMailRegistryPageUi&args=%5B0%5D'
          BODY="$(curl -L --fail --silent --show-error --max-time 60 "$URL")"
          echo "$BODY" | grep -q '"ok":true'
