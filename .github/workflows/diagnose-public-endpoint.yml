name: Diagnose public Apps Script endpoint
on:
  push:
    branches: [v2-rebuild]
    paths:
      - '.github/workflows/diagnose-public-endpoint.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoint
        id: probe
        shell: bash
        run: |
          URL='https://script.google.com/macros/s/AKfycbzseFMx8oDQPQ0BtUu6rvZiGAdZRFX6-uR2q9bqFF69olKK2pgvl_dGLJ6bC3MPLVcn7g/exec?method=v2HealthCheck&args=%5B%5D'
          code="$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 "$URL" || true)"
          final="$(curl -L -sS -o /dev/null -w '%{url_effective}' --max-time 30 "$URL" || true)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if echo "$final" | grep -Eq 'accounts\.google\.com|ServiceLogin'; then echo "kind=login" >> "$GITHUB_OUTPUT";
          elif echo "$final" | grep -q 'script.googleusercontent.com'; then echo "kind=googleusercontent" >> "$GITHUB_OUTPUT";
          else echo "kind=other" >> "$GITHUB_OUTPUT"; fi
          if grep -q '"ok":true' /tmp/body; then echo "bodyok=yes" >> "$GITHUB_OUTPUT"; else echo "bodyok=no" >> "$GITHUB_OUTPUT"; fi
          if grep -Eqi 'sign in|accounts.google.com|ServiceLogin' /tmp/body; then echo "bodylogin=yes" >> "$GITHUB_OUTPUT"; else echo "bodylogin=no" >> "$GITHUB_OUTPUT"; fi
      - name: HTTP 200 detected
        if: steps.probe.outputs.code == '200'
        run: echo yes
      - name: HTTP 404 detected
        if: steps.probe.outputs.code == '404'
        run: echo yes
      - name: HTTP 302 detected
        if: steps.probe.outputs.code == '302'
        run: echo yes
      - name: HTTP 303 detected
        if: steps.probe.outputs.code == '303'
        run: echo yes
      - name: HTTP 401 detected
        if: steps.probe.outputs.code == '401'
        run: echo yes
      - name: HTTP 403 detected
        if: steps.probe.outputs.code == '403'
        run: echo yes
      - name: HTTP 500 detected
        if: steps.probe.outputs.code == '500'
        run: echo yes
      - name: HTTP 502 detected
        if: steps.probe.outputs.code == '502'
        run: echo yes
      - name: HTTP 503 detected
        if: steps.probe.outputs.code == '503'
        run: echo yes
      - name: Other HTTP detected
        if: steps.probe.outputs.code != '200' && steps.probe.outputs.code != '404' && steps.probe.outputs.code != '302' && steps.probe.outputs.code != '303' && steps.probe.outputs.code != '401' && steps.probe.outputs.code != '403' && steps.probe.outputs.code != '500' && steps.probe.outputs.code != '502' && steps.probe.outputs.code != '503'
        run: echo yes
      - name: Redirected to login
        if: steps.probe.outputs.kind == 'login'
        run: echo yes
      - name: Redirected to googleusercontent
        if: steps.probe.outputs.kind == 'googleusercontent'
        run: echo yes
      - name: Other final URL
        if: steps.probe.outputs.kind == 'other'
        run: echo yes
      - name: Body has ok true
        if: steps.probe.outputs.bodyok == 'yes'
        run: echo yes
      - name: Body missing ok true
        if: steps.probe.outputs.bodyok == 'no'
        run: echo yes
      - name: Body is login page
        if: steps.probe.outputs.bodylogin == 'yes'
        run: echo yes
      - name: Body is not login page
        if: steps.probe.outputs.bodylogin == 'no'
        run: echo yes
