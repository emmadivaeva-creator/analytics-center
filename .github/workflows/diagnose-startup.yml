name: Analytics Center startup checks
on:
  push:
    branches: [v2-rebuild, fix/startup-without-google]
    paths:
      - '.github/workflows/diagnose-startup.yml'
      - 'tests/startup-browser.cjs'
      - 'tests/mail-render.cjs'
      - 'tests/mail-demo-attribution.cjs'
      - 'domain-auth.js'
      - 'domain-config.js'
      - 'app.js'
      - 'index.html'
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate frontend syntax
        run: |
          node --check app.js
          node --check domain-auth.js
          node --check domain-config.js
          node --check tests/startup-browser.cjs
      - name: Verify exact DEMO attribution with synthetic data
        run: node tests/mail-demo-attribution.cjs
      - name: Prepare browser
        run: npm install --prefix "$RUNNER_TEMP/analytics-browser" --no-audit --no-fund playwright@1.56.1
      - name: Render nonempty mail tables
        env:
          NODE_PATH: /home/runner/work/_temp/analytics-browser/node_modules
        run: node tests/mail-render.cjs
      - name: Reproduce baseline failure and verify fixed startup
        env:
          NODE_PATH: ${{ runner.temp }}/analytics-browser/node_modules
          LIVE_AUDIT: '1'
        run: node tests/startup-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-startup-checks
          retention-days: 1
          path: |
            startup-tabs.json
            mail-demo-unit-results.json
