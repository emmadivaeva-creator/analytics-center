name: One-shot classification v3 maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-classification-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align base and canonical classification
        run: |
          python - <<'PY'
          from pathlib import Path

          code = Path('Code.gs')
          text = code.read_text(encoding='utf-8')
          text = text.replace("parserVersion: 'sendsay-webarchive-v2'", "parserVersion: 'sendsay-webarchive-v3'", 1)
          text = text.replace(r"^\s*\d+\s*\|\s*(?:demo|news)\s*\|\s*(.*?)\s*\|\s*sendsay\s*$", r"^\s*\d+\s*(?:\||_)\s*(?:demo|news)\s*(?:\||_)\s*(.*?)\s*(?:\||_)\s*sendsay\s*$", 1)
          text = text.replace(r"generic[1].replace(/\s*\|\s*Sendsay\s*$/i, '').trim()", r"generic[1].replace(/\s*(?:\||_)\s*Sendsay\s*$/i, '').trim()", 1)

          old_type = "  const type = /letter_news|\\bnews\\b|digest/.test(text) ? 'news' : 'demo';\n"
          new_type = "  const isNews = canonicalNewsCampaign_(campaign);\n  const type = isNews ? 'news' : 'demo';\n"
          if old_type in text:
              text = text.replace(old_type, new_type, 1)
          elif new_type not in text:
              raise SystemExit('Base NEWS type block not found')

          fallback_lines = [
              '',
              "  if (product === 'Не указано') {",
              "    const sourceIdMatch = String(fileName || '').match(/^\\s*(\\d+)/);",
              "    const sourceId = sourceIdMatch ? sourceIdMatch[1] : '';",
              '    const productBySourceId = {',
              "      '265': 'ГФ Периодика',",
              "      '729': 'ГЗ Периодика',",
              "      '818': 'ГЗ Система',",
              "      '1005': 'ГФ Школа',",
              "      '1213': 'ГЗ Школа',",
              "      '1223': 'ГФ Система'",
              '    };',
              '    if (productBySourceId[sourceId]) {',
              '      product = productBySourceId[sourceId];',
              '      flow = product;',
              '    }',
              '  }',
              ''
          ]
          fallback = '\n'.join(fallback_lines)
          segment_marker = "\n  let segment = type === 'news' ? 'Новостная рассылка' : 'Живые';\n"
          if "'1005': 'ГФ Школа'" not in text:
              if segment_marker not in text:
                  raise SystemExit('Base classification segment marker not found')
              text = text.replace(segment_marker, fallback + segment_marker, 1)

          limit_block = "  if (bytes.length > 35 * 1024 * 1024) {\n    throw new Error('Файл «' + name + '» больше 35 МБ. Положите его в папку Drive и нажмите «Обновить данные».');\n  }\n\n"
          text = text.replace(limit_block, '', 1)
          code.write_text(text, encoding='utf-8')

          core = Path('CoreRules.gs')
          c = core.read_text(encoding='utf-8')
          core_marker = "\n  let segment = isNews ? 'Новостная рассылка' : 'Живые';\n"
          if "'1005': 'ГФ Школа'" not in c:
              if core_marker not in c:
                  raise SystemExit('CoreRules classification segment marker not found')
              c = c.replace(core_marker, fallback + core_marker, 1)
          core.write_text(c, encoding='utf-8')
          PY

      - name: Verify canonical classification
        run: |
          grep -q "sendsay-webarchive-v3" Code.gs
          grep -q "const isNews = canonicalNewsCampaign_" Code.gs
          grep -q "'1005': 'ГФ Школа'" Code.gs
          grep -q "'1005': 'ГФ Школа'" CoreRules.gs
          if grep -q "больше 35 МБ" Code.gs; then exit 1; fi

      - name: Commit classification update
        run: |
          git config user.name "analytics-center-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add Code.gs CoreRules.gs
          git commit -m "Harden canonical product and NEWS classification"
          git push
