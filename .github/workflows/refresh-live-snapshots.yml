name: Refresh live analytics snapshots

on:
  push:
    branches: [v2-rebuild]
    paths:
      - '.github/workflows/refresh-live-snapshots.yml'
      - '.github/scripts/refresh-live-snapshots.mjs'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: analytics-v2-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-rebuild
          fetch-depth: 0
      - name: Build cumulative DEMO and NEWS snapshots
        id: build
        env:
          NEWS_BATCH_SIZE: '55'
        run: node .github/scripts/refresh-live-snapshots.mjs
      - name: Verify snapshot payloads
        run: |
          node -e "const p=require('./pulse-current.json'); if(!Array.isArray(p.products)||!p.products.length)process.exit(1); console.log('pulse',p.week,p.products.reduce((s,x)=>s+Number(x.green||0),0))"
          node -e "const d=require('./demand-current.json'); if(!Array.isArray(d.evidence)||!d.evidence.length)process.exit(1); console.log('demand',d.evidence.length)"
          node -e "const n=require('./news-demo-current.json'); if(!Array.isArray(n.topics)||n.schemaVersion!==2||n.mailsChecked>n.mailsTotal)process.exit(1); console.log('news',n.mailsChecked+'/'+n.mailsTotal,'topics',n.topics.length,'weeks',n.weeks[0]+'-'+n.weeks.at(-1))"
          node -e "const a=require('./news-demo-letter-results.json'); const i=require('./news-demo-inventory.json'); if(!Array.isArray(i.emails)||!a.results)process.exit(1); console.log('news results',Object.keys(a.results).length,'known issues',i.emails.length)"
      - name: Commit refreshed snapshots
        run: |
          if git diff --quiet -- pulse-current.json demand-current.json news-demo-current.json news-demo-inventory.json news-demo-letter-results.json; then
            echo "Snapshots unchanged"
            exit 0
          fi
          git config user.name "analytics-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pulse-current.json demand-current.json news-demo-current.json news-demo-inventory.json news-demo-letter-results.json
          git commit -m "Refresh live analytics snapshots [skip ci]"
          # Other Analytics Center publishes may land between fetch and push.
          # Rebase onto the newest branch and retry without overwriting commits.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin v2-rebuild
            git rebase origin/v2-rebuild
            if git push origin HEAD:v2-rebuild; then
              echo "Snapshot update published on attempt $attempt"
              exit 0
            fi
            echo "Branch moved during snapshot push ($attempt/8), retrying safely"
            sleep $((attempt * 3))
          done
          echo "::error::Unable to publish refreshed snapshots after 8 rebases"
          exit 1

      - name: Continue historical NEWS backfill
        if: steps.build.outputs.archive_pending != '0' && steps.build.outputs.archive_added != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_dispatch from GITHUB_TOKEN is an allowed workflow trigger.
          # Continue in a new serialized run; every completed batch is committed.
          gh workflow run refresh-live-snapshots.yml --ref v2-rebuild
