name: V2 bridge backend

on:
  push:
    branches: [v2-rebuild]
    paths:
      - '.github/workflows/v2-bridge-backend.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-rebuild
      - name: Patch AppEntry bridge shell
        shell: python
        run: |
          from pathlib import Path
          p=Path('AppEntry.gs')
          s=p.read_text(encoding='utf-8')
          start=s.index('/**\n * Analytics Center V2.')
          marker=s.index('/**\n * Пульс читает DEMO', start)
          new_head=r'''/**
 * Analytics Center V2.
 *
 * Архитектура после bridge-migration:
 * - UI публикуется на GitHub Pages;
 * - Apps Script Web App отдаёт только лёгкую оболочку с iframe;
 * - iframe общается с backend через postMessage -> google.script.run;
 * - UI можно менять в GitHub без нового Apps Script deployment.
 */
const V2_FRONTEND_PAGE_ = 'https://emmadivaeva-creator.github.io/analytics-center/';
const V2_BACKEND_BUILD_ = 'v2-backend-bridge-2026-09-09-03';

function buildAnalyticsWebApp_() {
  const frontendUrl = V2_FRONTEND_PAGE_ + '?ts=' + Date.now();
  const html = `<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics Center</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f4f6f9}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:14px Arial,sans-serif;color:#667085;background:#f4f6f9;z-index:2}
</style>
</head>
<body>
<div id="boot">Загружаю Analytics Center…</div>
<iframe id="appFrame" src="${frontendUrl}" allow="clipboard-read; clipboard-write"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('appFrame');
  const boot=document.getElementById('boot');
  const allowedOrigin='https://emmadivaeva-creator.github.io';
  frame.addEventListener('load',function(){boot.style.display='none';});

  function reply(target,origin,payload){
    try{target.postMessage(payload,origin||'*');}catch(e){target.postMessage(payload,'*');}
  }

  window.addEventListener('message',function(event){
    if(event.source!==frame.contentWindow) return;
    if(event.origin!==allowedOrigin) return;
    const msg=event.data||{};
    if(msg.type!=='analytics-rpc'||!msg.id||!msg.method) return;
    const args=Array.isArray(msg.args)?msg.args:[];

    try{
      const runner=google.script.run
        .withSuccessHandler(function(result){reply(event.source,event.origin,{type:'analytics-rpc-result',id:msg.id,ok:true,result:result});})
        .withFailureHandler(function(err){reply(event.source,event.origin,{type:'analytics-rpc-result',id:msg.id,ok:false,error:err&&err.message?err.message:String(err)});});
      if(typeof runner[msg.method]!=='function') throw new Error('Неизвестный серверный метод: '+msg.method);
      runner[msg.method](...args);
    }catch(err){
      reply(event.source,event.origin,{type:'analytics-rpc-result',id:msg.id,ok:false,error:err&&err.message?err.message:String(err)});
    }
  });
})();
</script>
</body>
</html>`;

  return HtmlService.createHtmlOutput(html)
    .setTitle('Analytics Center')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.DEFAULT)
    .addMetaTag('viewport','width=device-width, initial-scale=1');
}

function v2HealthCheck() {
  return {
    ok: true,
    backendBuild: V2_BACKEND_BUILD_,
    frontendMode: 'github-pages-bridge',
    checkedAt: new Date().toISOString()
  };
}

'''
          s=new_head+s[marker:]
          p.write_text(s,encoding='utf-8')
      - name: Commit backend shell
        run: |
          git config user.name "analytics-center-bot"
          git config user.email "actions@users.noreply.github.com"
          git add AppEntry.gs
          git commit -m "Serve V2 through GitHub Pages RPC bridge"
          git push origin v2-rebuild
