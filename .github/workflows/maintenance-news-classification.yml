name: One-shot NEWS classification maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-news-classification.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align final polish with canonical NEWS rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('final_polish_ui.html')
          text = p.read_text(encoding='utf-8')
          old = """  function isDigest(x){\n    return /(?:^|[_\\-. ])digest(?:[_\\-. ]|$)/i.test(campaignText(x));\n  }\n"""
          new = """  function isDigest(x){\n    const c=campaignText(x).trim();\n    return /^Gosfinansi_letter_news_GF_digest(?:_|$)/i.test(c) ||\n      /^letter_news_goszakaz_regular_news_digest(?:_|$)/i.test(c);\n  }\n"""
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('Expected final_polish isDigest block not found; refusing unsafe patch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "analytics-center-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add final_polish_ui.html
          git commit -m "Align final analytics with canonical NEWS rules"
          git push
