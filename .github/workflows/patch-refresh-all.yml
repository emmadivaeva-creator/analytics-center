name: Patch refresh all
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-rebuild
      - run: python patch_refresh.py
      - run: |
          git config user.name "analytics-center-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git commit -m "Make refresh button sync all Analytics Center data"
          git push origin v2-rebuild
