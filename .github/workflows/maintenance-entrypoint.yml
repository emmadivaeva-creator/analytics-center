name: One-shot analytics entrypoint maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-entrypoint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Canonicalize Apps Script entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Code.gs')
          text = p.read_text(encoding='utf-8')
          old = """function doGet() {\n  return HtmlService.createHtmlOutputFromFile('index')\n    .setTitle('Редакционная аналитика DEMO')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.DEFAULT)\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n"""
          new = """function doGet() {\n  return buildAnalyticsWebApp_();\n}\n"""
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected doGet block not found; refusing unsafe patch')

          count = 0
          for f in Path('.').glob('*.gs'):
              count += f.read_text(encoding='utf-8').count('function doGet(')
          if count != 1:
              raise SystemExit(f'Expected exactly one function doGet( across .gs files, found {count}')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- Code.gs; then
            echo "No Code.gs changes required"
            exit 0
          fi
          git config user.name "analytics-center-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add Code.gs
          git commit -m "Use modular builder as canonical doGet"
          git push
