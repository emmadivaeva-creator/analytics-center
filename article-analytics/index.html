<!doctype html>
<html lang="ru" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Центр аналитики статей</title>
<style>
html,body,#frame{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#f5f6f8}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:14px Arial,sans-serif;color:#59606c;background:#f5f6f8;z-index:2}
</style>
</head>
<body>
<div id="loading">Загружаю аналитику…</div>
<iframe id="frame" title="Аналитика статей"></iframe>
<script>
(async()=>{
 const f=document.getElementById('frame'),l=document.getElementById('loading');
 try{
  const [source,overlay]=await Promise.all([
   fetch('app.html?v=20260910-context1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Не удалось загрузить приложение: '+r.status);return r.text()}),
   fetch('kpi-overlay.js?v=20260910-context1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Не удалось загрузить сводку: '+r.status);return r.text()})
  ]);
  f.srcdoc=source.replace('</body>','<script>'+overlay+'<\/script></body>');
  f.addEventListener('load',()=>l.remove(),{once:true});
 }catch(e){l.textContent='Ошибка загрузки: '+(e.message||e)}
})();
</script>
</body>
</html>
