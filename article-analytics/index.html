<!doctype html>
<html lang="ru" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Центр аналитики статей</title>
<style>
html,body,#frame{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#f5f6f8}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:14px Arial,sans-serif;color:#59606c;background:#f5f6f8;z-index:2}
</style>
</head>
<body>
<div id="loading">Загружаю аналитику…</div>
<iframe id="frame" title="Аналитика статей"></iframe>
<script>
(async()=>{
 const f=document.getElementById('frame'),l=document.getElementById('loading');
 try{
  let [source,weeklyOverlay]=await Promise.all([
   fetch('app.html?v=20260910-fix5',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Не удалось загрузить приложение: '+r.status);return r.text()}),
   fetch('weekly-progos-overlay.js?v=20260910-fix5',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Не удалось загрузить недельный модуль: '+r.status);return r.text()})
  ]);

  const init="refreshFilterOptions();renderAll();switchView('overview');";
  if(!source.includes(init)) throw new Error('Не найдена точка подключения недельного отчёта');
  weeklyOverlay=weeklyOverlay.replace('(async()=>{','await (async()=>{');
  weeklyOverlay=weeklyOverlay.replace(
   "const pt=all.reduce((s,x)=>s+x.prev,0),ct=all.reduce((s,x)=>s+x.curr,0),chg=pt?(ct-pt)/pt:null;",
   "const siteTotals=WD.totals?.[state.site]||[];const pt=siteTotals.at(-2)||0,ct=siteTotals.at(-1)||0,chg=pt?(ct-pt)/pt:null;"
  );
  source=source.replace(init,weeklyOverlay+'\n'+init);

  const kpiLine="document.getElementById('filterbar').style.display=(v==='nontarget'||v==='kpiexclude'||v==='cleanup'||v==='method')?'none':'grid';";
  const kpiPatched=kpiLine+"\n document.getElementById('kpis').style.display=(v==='overview')?'grid':'none';";
  if(!source.includes(kpiLine)) throw new Error('Не найдена точка управления верхней сводкой');
  source=source.replace(kpiLine,kpiPatched);

  f.srcdoc=source;
  f.addEventListener('load',()=>l.remove(),{once:true});
 }catch(e){l.textContent='Ошибка загрузки: '+(e.message||e)}
})();
</script>
</body>
</html>
