<!doctype html><html lang="ru" translate="no" class="notranslate"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Центр аналитики статей</title></head><body><div id="loading">Загружаю аналитику…</div><iframe id="frame" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe><script>(async()=>{const f=document.getElementById('frame'),l=document.getElementById('loading');try{const s=await fetch('app.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Не удалось загрузить приложение: '+r.status);return r.text()});f.srcdoc=s;f.addEventListener('load',()=>l.remove(),{once:true})}catch(e){l.textContent='Ошибка загрузки: '+(e.message||e)}})();</script></body></html>
