<!doctype html><html lang="ru" translate="no" class="notranslate"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Центр аналитики статей</title><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#f5f6f8}#loading{position:fixed;inset:0;display:grid;place-items:center;font:14px Arial,sans-serif;color:#59606c;background:#f5f6f8;z-index:2}#error{max-width:720px;padding:28px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}</style></head><body><div id="loading"><div>Загружаю аналитику…</div></div><iframe id="frame" title="Аналитика статей"></iframe><script>(async()=>{const loading=document.getElementById('loading'),frame=document.getElementById('frame');try{let source=await fetch('app.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Не удалось загрузить приложение: '+r.status);return r.text()});frame.srcdoc=source;frame.addEventListener('load',()=>loading.remove(),{once:true})}catch(err){loading.innerHTML='<div id="error"><b>Не удалось загрузить аналитику.</b><br><br>'+String(err.message||err)+'</div>'}})();</script></body></html>
