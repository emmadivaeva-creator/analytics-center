<script>
(function(){
  /* Решения по плану учитывают не только цифры, но и сколько времени осталось до конца недели. */
  function maturityDays(p){ return /Школа/i.test(String(p && p.product || '')) ? 6 : 3; }
  function daysLeftInWeek(){ return Math.max(0,5-workday()); }
  function canNewPushMature(p){ return daysLeftInWeek() >= maturityDays(p); }

  status = function(p){
    if(n(p.plan) && n(p.green) >= n(p.plan)) return {key:'done',label:'План закрыт'};
    if(workday() === 5) return {key:'risk',label:'Недобор недели'};
    if(n(p.plan) && pace(p) >= n(p.plan)) return {key:'done',label:'По темпу закрываем'};
    if(n(p.plan) && potential(p) >= n(p.plan)) return {key:'wait',label:'Ждём уже отправленные'};
    if(canNewPushMature(p)) return {key:'risk',label:'Нужен дожим сейчас'};
    return {key:'risk',label:'Дожим уже не успеет'};
  };

  decisionText = function(p){
    const gap=Math.max(0,n(p.plan)-n(p.green)), y=n(p.yellow), shortAfterYellow=Math.max(0,n(p.plan)-potential(p));
    if(n(p.plan) && n(p.green) >= n(p.plan)) return 'Ничего не дожимаем. План уже закрыт.';
    if(workday() === 5) return `Пятница: до плана ${gap}. Текущую неделю уже не спасаем новым письмом. Фиксируем недобор; жёлтые демо считаем переходящим потенциалом, а не способом закрыть этот план.`;
    if(n(p.plan) && pace(p) >= n(p.plan)) return 'По текущему темпу план ещё может закрыться уже запущенными активностями. Новый дожим пока не ставим.';
    if(n(p.plan) && potential(p) >= n(p.plan)) return `До плана ${gap}. Жёлтых демо уже ${y}, потенциально этого хватает. Ждём только уже отправленные письма; новый дожим в расчёт текущей недели не подмешиваем.`;
    if(canNewPushMature(p)) return `До плана ${gap}, жёлтых демо ${y}; даже при полном дозревании останется ${shortAfterYellow}. Дожим нужен сейчас, пока он ещё успевает повлиять на текущую неделю.`;
    return `До плана ${gap}, жёлтых демо ${y}; после них всё равно останется ${shortAfterYellow}. Но новый дожим уже не успеет созреть в эту неделю: для ${/Школа/i.test(String(p.product||''))?'Школы нужно около 6 дней':'Периодики/Системы нужно около 3 дней'}. Фиксируем риск недобора; следующую отправку считаем уже работой на следующий период.`;
  };

  /* Пульс: в пятницу показываем итог, а не прогноз к уже наступившей пятнице. */
  card = function(name){
    const p=product(name),s=status(p),pr=n(p.plan)?n(p.green)/n(p.plan)*100:0,gap=Math.max(0,n(p.plan)-n(p.green));
    const friday=workday()===5;
    const right=friday
      ? `<span class="pulse-forecast">итог <b>${fmt.format(p.green)}</b> зелёных демо</span>`
      : `<span class="pulse-forecast">прогноз <b>${fmt.format(pace(p))}</b></span>`;
    const yLabel=friday?'Жёлтые, переходящие':'Жёлтые';
    return `<article class="pcard pulse-clean ${s.key}"><div class="ptop"><b>${esc(name)}</b><span class="badge ${s.key}">${s.label}</span></div><div class="mainnum"><strong>${pct.format(pr)}%</strong><span><b>${fmt.format(p.green)}</b> зелёных демо<br>из плана ${fmt.format(p.plan)}</span></div><div class="progress"><i style="width:${Math.min(100,Math.max(0,pr))}%"></i></div><div class="pulse-bottom"><span>${gap?`До плана <b>${fmt.format(gap)}</b>`:'<b>План закрыт</b>'} · ${yLabel} ${fmt.format(p.yellow)}</span>${right}</div></article>`;
  };

  const baseRenderWeek2=renderWeek;
  renderWeek=function(){
    baseRenderWeek2();
    const legend=document.querySelector('#weekView .legend');
    if(!legend) return;
    if(workday()===5){
      legend.innerHTML='<span><i class="dot g"></i>Зелёные демо = итог недели</span><span><i class="dot y"></i>Жёлтые демо = переходящий потенциал</span><span>В пятницу новый дожим на текущий план уже не ставим</span>';
    } else {
      legend.innerHTML='<span><i class="dot g"></i>Зелёные демо = факт</span><span><i class="dot y"></i>Жёлтые демо = уже запущенный потенциал</span><span>Новый дожим учитываем только пока он успевает созреть</span>';
    }
  };

  /* NEWS определяем только по двум штатным Campaign. */
  function isNewsMail(x){
    const c=String(x && x.campaign || '').trim();
    return /^Gosfinansi_letter_news_GF_digest(?:_|$)/i.test(c) || /^letter_news_goszakaz_regular_news_digest(?:_|$)/i.test(c);
  }

  /* Во вкладке «Письма» оставляем только обычные DEMO. */
  const baseFilteredEmails2=filteredEmails;
  filteredEmails=function(){ return baseFilteredEmails2().filter(x=>!isActive(x) && !isNewsMail(x)); };
  const emailType=document.querySelector('#emailType');
  if(emailType && emailType.options){
    [...emailType.options].forEach(o=>{ if(o.value==='active'||o.value==='news') o.remove(); });
    if(emailType.options[0]) emailType.options[0].textContent='Обычные DEMO';
  }

  const baseRenderEmails2=renderEmails;
  renderEmails=function(){
    baseRenderEmails2();
    const title=document.querySelector('#emailsView .head h1'),subtitle=document.querySelector('#emailsView .head p');
    if(title) title.textContent='Обычные DEMO-рассылки';
    if(subtitle) subtitle.textContent='Только обычные DEMO. Дожим DEMO и новостные рассылки вынесены в отдельные вкладки.';
    const rows=filteredEmails(),metrics=document.querySelectorAll('#emailMetrics .metric');
    if(metrics[3]) metrics[3].innerHTML=`<span>Зелёные демо</span><strong>${fmt.format(rows.reduce((s,x)=>s+n(x.green),0))}</strong><small>по обычным DEMO</small>`;
  };

  /* Без общего лимита: браузер вызывает сервер порциями до полного опустошения очереди. */
  async function syncAllReliable(){
    if(state.busy)return;
    if(!apps())return toast('Синхронизация доступна только в веб-приложении Apps Script');
    setBusy(true);
    let done=0,first=true;
    try{
      while(true){
        const r=await server('syncDriveReportsReliable',first);
        first=false;
        done+=n(r&&r.processed);
        const service=document.querySelector('#serviceStatus');
        if(service)service.textContent=r&&r.remaining?`Обработано ${done}, осталось ${r.remaining}…`:`Письма обработаны: ${done}`;
        if(!r||!r.remaining||!r.processed)break;
      }
      const service=document.querySelector('#serviceStatus');
      if(service)service.textContent='Пересчитываем DEMO…';
      const d=await server('syncDemoStats');
      await load(true);
      toast(`Готово · DEMO связано ${d&&d.matched!=null?d.matched:0}`);
    }catch(e){toast('Ошибка синхронизации: '+(e.message||String(e)))}
    finally{setBusy(false)}
  }

  syncAll=syncAllReliable;
  const syncBtn=document.querySelector('#syncBtn');
  if(syncBtn){syncBtn.disabled=!apps();syncBtn.onclick=syncAllReliable;}

  /* Ручная загрузка тоже без общего лимита по числу файлов. */
  uploadFiles=async function(files){
    files=[...(files||[])];
    if(!files.length||!apps())return;
    setBusy(true);
    let saved=0;
    try{
      for(const file of files){
        if(!/\.(webarchive|mhtml|mht)$/i.test(file.name))throw new Error(`«${file.name}» — нужен .webarchive, .mhtml или .mht`);
        const form=document.createElement('form'),input=document.createElement('input'),dt=new DataTransfer();
        input.type='file';input.name='reportFile';dt.items.add(file);input.files=dt.files;
        form.className='hidden';form.appendChild(input);document.body.appendChild(form);
        try{await server('saveSendsayReportFile',form);saved++}finally{form.remove()}
      }
      let first=true;
      while(true){
        const r=await server('syncDriveReportsReliable',first);
        first=false;
        if(!r||!r.remaining||!r.processed)break;
      }
      await server('syncDemoStats');
      await load(true);
      toast(`Сохранено и синхронизировано ${saved} файлов`);
    }catch(e){toast(e.message||String(e))}
    finally{
      const input=document.querySelector('#reportFiles');
      if(input)input.value='';
      setBusy(false);
    }
  };

  const reportFiles=document.querySelector('#reportFiles');
  if(reportFiles)reportFiles.onchange=e=>uploadFiles([...e.target.files]);

  if(state.data){ renderWeek(); renderEmails(); }
})();
</script>
