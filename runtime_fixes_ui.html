<script>
(function(){
  /* Решения по плану учитывают не только цифры, но и сколько времени осталось до конца недели. */
  function maturityDays(p){ return /Школа/i.test(String(p && p.product || '')) ? 6 : 3; }
  function daysLeftInWeek(){ return Math.max(0,5-workday()); }
  function canNewPushMature(p){ return daysLeftInWeek() >= maturityDays(p); }

  status = function(p){
    if(n(p.plan) && n(p.green) >= n(p.plan)) return {key:'done',label:'План закрыт'};
    if(workday() === 5) return {key:'risk',label:'Недобор недели'};
    if(n(p.plan) && pace(p) >= n(p.plan)) return {key:'done',label:'По темпу закрываем'};
    if(n(p.plan) && potential(p) >= n(p.plan)) return {key:'wait',label:'Ждём уже отправленные'};
    if(canNewPushMature(p)) return {key:'risk',label:'Нужен дожим сейчас'};
    return {key:'risk',label:'Дожим уже не успеет'};
  };

  decisionText = function(p){
    const gap=Math.max(0,n(p.plan)-n(p.green)), y=n(p.yellow), shortAfterYellow=Math.max(0,n(p.plan)-potential(p));
    if(n(p.plan) && n(p.green) >= n(p.plan)) return 'Ничего не дожимаем. План уже закрыт.';
    if(workday() === 5) return `Пятница: до плана ${gap}. Текущую неделю уже не спасаем новым письмом. Фиксируем недобор; Yellow считаем переходящим потенциалом, а не способом закрыть этот план.`;
    if(n(p.plan) && pace(p) >= n(p.plan)) return 'По текущему темпу план ещё может закрыться уже запущенными активностями. Новый дожим пока не ставим.';
    if(n(p.plan) && potential(p) >= n(p.plan)) return `До плана ${gap}. В Yellow уже ${y}, потенциально этого хватает. Ждём только уже отправленные письма; новый дожим в расчёт текущей недели не подмешиваем.`;
    if(canNewPushMature(p)) return `До плана ${gap}, Yellow ${y}; даже при полном дозревании останется ${shortAfterYellow}. Дожим нужен сейчас, пока он ещё успевает повлиять на текущую неделю.`;
    return `До плана ${gap}, Yellow ${y}; после него всё равно останется ${shortAfterYellow}. Но новый дожим уже не успеет созреть в эту неделю: для ${/Школа/i.test(String(p.product||''))?'Школы нужно около 6 дней':'Периодики/Системы нужно около 3 дней'}. Фиксируем риск недобора; следующую отправку считаем уже работой на следующий период.`;
  };

  /* Пульс: в пятницу показываем итог, а не нелепый «прогноз к пятнице». */
  card = function(name){
    const p=product(name),s=status(p),pr=n(p.plan)?n(p.green)/n(p.plan)*100:0,gap=Math.max(0,n(p.plan)-n(p.green));
    const friday=workday()===5;
    const right=friday
      ? `<span class="pulse-forecast">итог <b>${fmt.format(p.green)}</b> Green</span>`
      : `<span class="pulse-forecast">прогноз <b>${fmt.format(pace(p))}</b></span>`;
    const yLabel=friday?'Y переходящий':'Y';
    return `<article class="pcard pulse-clean ${s.key}"><div class="ptop"><b>${esc(name)}</b><span class="badge ${s.key}">${s.label}</span></div><div class="mainnum"><strong>${pct.format(pr)}%</strong><span><b>${fmt.format(p.green)}</b> Green<br>из плана ${fmt.format(p.plan)}</span></div><div class="progress"><i style="width:${Math.min(100,Math.max(0,pr))}%"></i></div><div class="pulse-bottom"><span>${gap?`До плана <b>${fmt.format(gap)}</b>`:'<b>План закрыт</b>'} · ${yLabel} ${fmt.format(p.yellow)}</span>${right}</div></article>`;
  };

  const baseRenderWeek2=renderWeek;
  renderWeek=function(){
    baseRenderWeek2();
    const legend=document.querySelector('#weekView .legend');
    if(!legend) return;
    if(workday()===5){
      legend.innerHTML='<span><i class="dot g"></i>Green = итог недели</span><span><i class="dot y"></i>Yellow = переходящий потенциал</span><span>В пятницу новый дожим на текущий план уже не ставим</span>';
    } else {
      legend.innerHTML='<span><i class="dot g"></i>Green = факт</span><span><i class="dot y"></i>Yellow = уже запущенный потенциал</span><span>Новый дожим учитываем только пока он успевает созреть</span>';
    }
  };

  /* В обычной вкладке «Письма» оставляем только обычные DEMO.
     АКТИВДЕМО и новостные живут в своих отдельных вкладках. */
  function isNewsMail(x){
    return String(x && x.type || '').toLowerCase()==='news' || /(?:^|[_\-])nd(?:[_\-.]|$)|news|novost/i.test(String(x && x.campaign || ''));
  }
  const baseFilteredEmails2=filteredEmails;
  filteredEmails=function(){ return baseFilteredEmails2().filter(x=>!isActive(x) && !isNewsMail(x)); };
  const emailType=document.querySelector('#emailType');
  if(emailType){ [...emailType.options].forEach(o=>{ if(o.value==='active'||o.value==='news') o.remove(); }); }

  const baseRenderEmails2=renderEmails;
  renderEmails=function(){
    baseRenderEmails2();
    const title=document.querySelector('#emailsView .head h1'),subtitle=document.querySelector('#emailsView .head p');
    if(title) title.textContent='Фактически отправленные DEMO-письма';
    if(subtitle) subtitle.textContent='Только обычные DEMO. АКТИВДЕМО и новостные вынесены в отдельные вкладки.';
    const rows=filteredEmails(),metrics=document.querySelectorAll('#emailMetrics .metric');
    if(metrics[3]) metrics[3].innerHTML=`<span>Средний CTR</span><strong>${pct.format(weighted(rows,'clickRate'))}%</strong><small>обычные DEMO</small>`;
  };

  if(state.data){ renderWeek(); renderEmails(); }
})();
</script>
