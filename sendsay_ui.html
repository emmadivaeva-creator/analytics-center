<style>
.ss-upload{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:linear-gradient(125deg,#163159,#285fbc);color:#fff;border-radius:15px;padding:15px 17px;margin-bottom:10px;box-shadow:var(--shadow)}
.ss-upload.drag{outline:3px solid #8bb1ff;outline-offset:2px}.ss-upload h2{margin:0;font-size:14px}.ss-upload p{margin:4px 0 0;color:#c8d7f0;font-size:10px}.ss-upload-actions{display:flex;align-items:center;gap:8px}.ss-upload label{background:#fff;color:#20437d;border-radius:9px;padding:9px 12px;font-size:10px;font-weight:900;cursor:pointer}.ss-upload small{font-size:9px;color:#c8d7f0}.ss-files{display:grid;gap:7px;margin-bottom:10px}.ss-file{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;align-items:center}.ss-file b{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ss-file span{display:block;font-size:9px;color:var(--muted);margin-top:2px}.ss-progress{height:5px;background:#edf0f5;border-radius:999px;overflow:hidden;margin-top:6px}.ss-progress i{display:block;height:100%;width:0;background:var(--blue);border-radius:999px;transition:width .2s}.ss-result{text-align:right;font-size:9px!important;line-height:1.45}.ss-result.ok{color:var(--green)}.ss-result.err{color:var(--red)}
@media(max-width:700px){.ss-upload,.ss-file{grid-template-columns:1fr}.ss-upload-actions{justify-content:flex-start}.ss-result{text-align:left!important}}
</style>
<script>
(function(){
  const emailsView=document.querySelector('#emailsView');
  if(!emailsView||document.querySelector('#ssDrop'))return;

  const head=emailsView.querySelector('.head');
  const box=document.createElement('div');
  box.innerHTML=`<div class="ss-upload" id="ssDrop"><div><h2>Загрузить отчёты Sendsay</h2><p>Сначала файлы сохраняются в подключённую папку Drive, затем единая синхронизация разбирает всю очередь до конца. Искусственного лимита по числу файлов нет.</p></div><div class="ss-upload-actions"><label for="ssFiles">Выбрать файлы</label><input class="hidden" id="ssFiles" type="file" multiple accept=".webarchive,.mhtml,.mht,application/x-webarchive,multipart/related"><small>можно сколько нужно</small></div></div><div class="ss-files hidden" id="ssFileList"></div>`;
  head.after(box);

  const q=s=>document.querySelector(s),drop=q('#ssDrop'),input=q('#ssFiles'),list=q('#ssFileList');

  function fileCard(file,i){
    return `<div class="ss-file" id="ssFile${i}"><div><b>${esc(file.name)}</b><span>${(file.size/1024/1024).toFixed(1)} МБ · ожидает сохранения</span><div class="ss-progress"><i></i></div></div><div class="ss-result">—</div></div>`;
  }

  function makeForm(file){
    const form=document.createElement('form'),fi=document.createElement('input'),dt=new DataTransfer();
    fi.type='file';fi.name='reportFile';dt.items.add(file);fi.files=dt.files;
    form.className='hidden';form.appendChild(fi);document.body.appendChild(form);
    return form;
  }

  async function syncUntilIdle(targetNames){
    const results={};
    let processed=0,first=true;
    while(true){
      const r=await server('syncDriveReportsReliable',first);
      first=false;
      processed+=n(r&&r.processed);
      (r&&Array.isArray(r.items)?r.items:[]).forEach(item=>{
        if(item&&item.fileName)results[item.fileName]=item;
      });
      const allTargetsSeen=targetNames.every(name=>results[name]);
      if(allTargetsSeen||!r||!r.remaining||!r.processed)break;
    }
    return {processed,results};
  }

  async function upload(files){
    files=[...files].filter(f=>/\.(webarchive|mhtml|mht)$/i.test(f.name));
    if(!files.length)return toast('Нужен .webarchive, .mhtml или .mht');
    if(!apps())return toast('Загрузка работает в Apps Script');

    list.classList.remove('hidden');
    list.innerHTML=files.map(fileCard).join('');

    const saved=[];
    let saveErrors=0;

    for(let i=0;i<files.length;i++){
      const file=files[i],card=q('#ssFile'+i),meta=card.querySelector('span'),bar=card.querySelector('.ss-progress i'),result=card.querySelector('.ss-result');
      try{
        meta.textContent='сохраняем в Drive…';bar.style.width='20%';
        const form=makeForm(file);
        let r;
        try{r=await server('saveSendsayReportFile',form)}finally{form.remove()}
        saved.push({name:file.name,fileId:r.fileId,index:i});
        bar.style.width='55%';meta.textContent='сохранён в Drive · ждёт разбора';
        result.className='ss-result';result.innerHTML='<b>Сохранён</b><br>запускаем синхронизацию';
      }catch(e){
        saveErrors++;bar.style.width='100%';bar.style.background='var(--red)';
        result.className='ss-result err';result.innerHTML='<b>Не сохранён</b><br>'+esc(e.message||e);meta.textContent='ошибка загрузки';
      }
    }

    let parsed=0,parseErrors=0;
    try{
      if(saved.length){
        const sync=await syncUntilIdle(saved.map(x=>x.name));
        saved.forEach(item=>{
          const card=q('#ssFile'+item.index),meta=card.querySelector('span'),bar=card.querySelector('.ss-progress i'),result=card.querySelector('.ss-result');
          const r=sync.results[item.name];
          bar.style.width='100%';
          if(r&&r.ok){
            parsed++;result.className='ss-result ok';result.innerHTML=`<b>Готово</b><br>${esc(r.product||'')}<br>${esc(r.subject||'')}`;meta.textContent='есть в Drive и в листе синхронизации';
          }else if(r&&r.ok===false){
            parseErrors++;bar.style.background='var(--red)';result.className='ss-result err';result.innerHTML='<b>Ошибка разбора</b><br>'+esc(r.error||'Смотрите служебный лист');meta.textContent='файл сохранён в Drive · ошибка записана в синхронизацию';
          }else{
            result.className='ss-result';result.innerHTML='<b>Сохранён в Drive</b><br>ещё не дошёл до очереди импорта';meta.textContent='файл не потерян · повторите синхронизацию';
          }
        });
        await server('syncDemoStats');
        await load(true);
      }
    }catch(e){toast(e.message||String(e))}

    toast(`Сохранено в Drive ${saved.length} · разобрано ${parsed}${parseErrors?` · ошибок разбора ${parseErrors}`:''}${saveErrors?` · не сохранено ${saveErrors}`:''}`);
    input.value='';
  }

  input.onchange=e=>upload(e.target.files);
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
  drop.addEventListener('drop',e=>upload(e.dataTransfer.files));
})();
</script>
