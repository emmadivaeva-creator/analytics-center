<style>
/* Новая палитра: теплый нейтральный фон + темный графит + бирюзовый акцент. */
:root{
  --bg:#f5f2ec;
  --card:#fffdfa;
  --ink:#24312d;
  --muted:#7b817d;
  --line:#e6dfd5;
  --nav:#26312e;
  --blue:#2f7f78;
  --blue-soft:#e7f2ef;
  --green:#2f7b5b;
  --green-soft:#e9f3ed;
  --yellow:#a47622;
  --yellow-soft:#f8f0dc;
  --red:#b65d50;
  --red-soft:#f8e9e6;
  --violet:#806b83;
  --shadow:0 10px 28px rgba(58,50,42,.07);
}
body{background:var(--bg)}
.top{background:var(--nav);box-shadow:0 7px 22px rgba(37,49,46,.16)}
.brandmark{background:linear-gradient(145deg,#4d8f85,#c57d5a)}
.navbtn.active,.navbtn:hover{background:rgba(255,255,255,.12)}
.primary{background:var(--blue)}
.week,.panel,.metric,.sumcard,.acard,.tablepanel,.heroitem,.servicebox,.news-card,.calls-card{background:var(--card)}
.eyebrow{color:var(--blue)}
.control:focus{border-color:#8fb9b3;box-shadow:0 0 0 3px #e5f1ef}
.tag.news{background:#efe7f0;color:#735c78}

/* Пульс DEMO: одна таблица вместо шести конкурирующих карточек. */
#weekView #matrix{display:block!important}
.pulse-simple{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.pulse-simple-head,.pulse-simple-row{display:grid;grid-template-columns:minmax(120px,1.25fr) 90px 110px 110px 110px minmax(120px,.9fr);gap:10px;align-items:center}
.pulse-simple-head{padding:10px 14px;background:#eee9e1;color:var(--muted);font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.04em}
.pulse-simple-row{padding:12px 14px;border-top:1px solid #eee8df;font-size:11px}
.pulse-simple-row:first-of-type{border-top:0}
.pulse-simple-name b{display:block;font-size:12px}.pulse-simple-name small{display:block;color:var(--muted);margin-top:2px}
.pulse-simple-pct{font-size:22px;font-weight:950;letter-spacing:-.04em}
.pulse-simple-num{font-variant-numeric:tabular-nums}.pulse-simple-num b{font-size:12px}
.pulse-simple-gap{font-weight:850}.pulse-simple-gap.good{color:var(--green)}
.pulse-simple-status{justify-self:start;font-size:8px;font-weight:900;border-radius:999px;padding:5px 7px;background:#eeeae4;color:#635f5a;white-space:nowrap}
.pulse-simple-status.done{background:var(--green-soft);color:var(--green)}.pulse-simple-status.wait{background:var(--yellow-soft);color:#85611d}.pulse-simple-status.risk{background:var(--red-soft);color:var(--red)}
.pulse-simple-row.risk{box-shadow:inset 4px 0 0 var(--red)}.pulse-simple-row.wait{box-shadow:inset 4px 0 0 var(--yellow)}.pulse-simple-row.done{box-shadow:inset 4px 0 0 var(--green)}
.pulse-simple-section{padding:7px 14px;background:#f8f5f0;border-top:1px solid #eee8df;font-size:10px;font-weight:900;color:#4c5a55}
@media(max-width:920px){.pulse-simple{overflow:auto}.pulse-simple-head,.pulse-simple-row{min-width:760px}}

/* Новая аналитика рассылок. */
.mail-segment-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.mail-segment-tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:10px;font-weight:850}
.mail-segment-tabs button.active{background:var(--ink);border-color:var(--ink);color:#fff}
.mail-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.mail-kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px}.mail-kpi span{display:block;font-size:8px;color:var(--muted)}.mail-kpi b{display:block;font-size:20px;margin-top:2px;letter-spacing:-.03em}.mail-kpi small{font-size:8px;color:var(--muted)}
.mail-analytics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mail-rank{padding:7px 15px 13px}.mail-rank-row{padding:10px 0;border-bottom:1px solid #eee8df;cursor:pointer}.mail-rank-row:last-child{border-bottom:0}.mail-rank-top{display:flex;justify-content:space-between;gap:10px}.mail-rank-top b{font-size:11px}.mail-rank-top strong{font-size:10px;white-space:nowrap}.mail-rank-meta{font-size:9px;color:var(--muted);margin-top:3px}.mail-rank-example{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.35}
.mail-rank-example b{color:var(--ink)}
.mail-note{font-size:9px;color:var(--muted);margin-top:8px}.mail-note b{color:var(--ink)}
@media(max-width:900px){.mail-kpis{grid-template-columns:1fr 1fr}.mail-analytics-grid{grid-template-columns:1fr}}
</style>
<script>
(function(){
  if(window.__finalPolishLoaded)return;
  window.__finalPolishLoaded=true;

  const q=s=>document.querySelector(s);
  const uniq=a=>[...new Set((a||[]).filter(Boolean))];

  function norm(v){return String(v||'').trim().toLowerCase();}
  function isDigest(x){
    const hay=[x&&x.campaign,x&&x.segment,x&&x.name,x&&x.issueName,x&&x.subjectTag].filter(Boolean).join(' ');
    return /(?:^|[^a-zа-я0-9])digest(?:[^a-zа-я0-9]|$)/i.test(hay);
  }
  function isLive(x){return norm(x&&x.segment)==='живые';}
  function isClicks(x){return norm(x&&x.segment)==='клики';}
  function isActiveDemo(x){return isActive(x)||/дожим\s*демо/i.test(String(x&&x.segment||''));}
  function segmentMode(x){if(isActiveDemo(x))return'active';if(isClicks(x))return'clicks';if(isLive(x))return'live';return'other';}

  /* Для вкладки «Новостные» считаем новостными только кампании с digest. */
  mailType=function(x){
    if(isActive(x))return'active';
    return isDigest(x)?'news':'direct';
  };

  /* Пульс: не карточки, а одна читаемая таблица. */
  function pulseStatus(p){return status(p);}
  function pulseRow(fullName,label){
    const p=product(fullName),s=pulseStatus(p),plan=n(p.plan),green=n(p.green),yellow=n(p.yellow),gap=Math.max(0,plan-green),pr=plan?green/plan*100:0;
    return `<div class="pulse-simple-row ${s.key}">
      <div class="pulse-simple-name"><b>${esc(label)}</b><small>${esc(fullName.startsWith('ГЗ')?'Госзаказ':'Госфинансы')}</small></div>
      <div class="pulse-simple-pct">${pct.format(pr)}%</div>
      <div class="pulse-simple-num">Green <b>${fmt.format(green)}</b></div>
      <div class="pulse-simple-num">План <b>${fmt.format(plan)}</b></div>
      <div class="pulse-simple-gap ${gap?'':'good'}">${gap?'− '+fmt.format(gap):'закрыт'}</div>
      <div><span class="pulse-simple-status ${s.key}">${esc(s.label)}</span><div class="mail-note">Y ${fmt.format(yellow)}</div></div>
    </div>`;
  }
  function renderCleanPulse(){
    const matrix=q('#matrix');if(!matrix||!state.data)return;
    matrix.innerHTML=`<div class="pulse-simple">
      <div class="pulse-simple-head"><span>Продукт</span><span>Выполнение</span><span>Green</span><span>План</span><span>Остаток</span><span>Статус / Yellow</span></div>
      <div class="pulse-simple-section">Госзаказ</div>
      ${pulseRow('ГЗ Периодика','Периодика')}${pulseRow('ГЗ Школа','Школа')}${pulseRow('ГЗ Система','Система')}
      <div class="pulse-simple-section">Госфинансы</div>
      ${pulseRow('ГФ Периодика','Периодика')}${pulseRow('ГФ Школа','Школа')}${pulseRow('ГФ Система','Система')}
    </div>`;
    const sub=q('#weekView .head p');if(sub)sub.textContent='Шесть продуктов в одной таблице: выполнение плана, Green, остаток, Yellow и решение. Без визуального салата.';
  }
  const prevRenderWeekFinal=renderWeek;
  renderWeek=function(){prevRenderWeekFinal();renderCleanPulse();};

  /* Полностью пересобираем вкладку «Аналитика писем». */
  let currentMode='live';
  function baseRows(){
    const p=q('#eaProduct')?q('#eaProduct').value:'';
    const w=q('#eaWeek')?q('#eaWeek').value:'';
    return (state.data&&state.data.emails||[]).filter(x=>(!p||x.product===p)&&(!w||String(x.week)===w));
  }
  function modeRows(){return baseRows().filter(x=>segmentMode(x)===currentMode);}
  function groupBy(rows,keyFn){const out={};rows.forEach(x=>{const k=keyFn(x)||'—';(out[k]||(out[k]=[])).push(x)});return Object.entries(out).map(([name,items])=>({name,items,count:items.length,del:items.reduce((s,x)=>s+n(x.delivered),0),or:weighted(items,'openRate'),ctr:weighted(items,'clickRate'),ctor:weighted(items,'ctor')}));}
  function sellingRows(){
    const rows=baseRows().filter(x=>isLive(x)&&!isActiveDemo(x)&&!isClicks(x)&&x.hasDemoData===true&&n(x.delivered)>0);
    const grouped={};rows.forEach(x=>{const key=String(x.material||x.subject||'').trim();if(!key)return;(grouped[key]||(grouped[key]=[])).push(x)});
    return Object.entries(grouped).map(([name,items])=>{const del=items.reduce((s,x)=>s+n(x.delivered),0),green=items.reduce((s,x)=>s+n(x.green),0),yellow=items.reduce((s,x)=>s+n(x.yellow),0);return{name,items,del,green,yellow,rate:del?green/del*1000:0};}).sort((a,b)=>b.rate-a.rate||b.green-a.green);
  }
  function renderRank(groups,metric){
    const rows=groups.slice(0,10);if(!rows.length)return'<div class="empty"><b>Пока нет данных</b></div>';
    return rows.map((g,i)=>`<div class="mail-rank-row" data-mail-rank="${i}"><div class="mail-rank-top"><b>${esc(g.name)}</b><strong>${metric==='ctr'?pct.format(g.ctr)+'% CTR':pct.format(g.or)+'% OR'}</strong></div><div class="mail-rank-meta">n=${g.count} · ${fmt.format(g.del)} доставлено · OR ${pct.format(g.or)}% · CTR ${pct.format(g.ctr)}% · CTOR ${pct.format(g.ctor)}%</div><div class="mail-rank-example">${g.items.slice().sort((a,b)=>n(b.openRate)-n(a.openRate)).slice(0,2).map(x=>`<div><b>${esc(x.product)}:</b> ${esc(x.subject)}</div>`).join('')}</div></div>`).join('');
  }
  function renderSelling(){
    const box=q('#eaSelling');if(!box)return;const selling=sellingRows();box._rows=selling;
    box.innerHTML=selling.length?selling.slice(0,15).map((x,i)=>`<div class="ea-item" data-selling="${i}"><div class="ea-top"><div class="ea-title">${esc(x.name)}</div><div class="ea-score">${pct.format(x.rate)} G / 1000</div></div><div class="ea-meta">ТОЛЬКО ЖИВЫЕ · ${fmt.format(x.green)} Green · ${fmt.format(x.yellow)} Yellow · ${x.items.length} пис. · ${fmt.format(x.del)} доставлено</div><div class="ea-products">${uniq(x.items.map(r=>r.product)).map(p=>`<span class="ea-product">${esc(p)}</span>`).join('')}</div></div>`).join(''):'<div class="empty"><b>Нет живых писем с точной DEMO-связью</b>Клики и АКТИВДЕМО сюда принципиально не входят.</div>';
  }
  function renderSegmentAnalytics(){
    const rows=modeRows(),del=rows.reduce((s,x)=>s+n(x.delivered),0),green=rows.reduce((s,x)=>s+n(x.green),0);
    const modeLabel=currentMode==='live'?'Живые':currentMode==='active'?'АКТИВДЕМО':'Клики';
    q('#eaModeTitle').textContent=modeLabel;
    q('#eaKpis').innerHTML=[['Писем',fmt.format(rows.length),'в выборке'],['Доставлено',fmt.format(del),'суммарно'],['OR',pct.format(weighted(rows,'openRate'))+'%','взвешенный'],['CTR',pct.format(weighted(rows,'clickRate'))+'%','взвешенный'],['Green',currentMode==='live'?fmt.format(green):'—',currentMode==='live'?'только для живых':'не смешиваем с живыми']].map(x=>`<div class="mail-kpi"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('');
    const themes=groupBy(rows,x=>theme(x.subject)).sort((a,b)=>b.or-a.or),times=groupBy(rows,x=>bucket(x.time)).filter(x=>x.name!=='Время не распознано').sort((a,b)=>b.or-a.or),best=rows.slice().sort((a,b)=>n(b.openRate)-n(a.openRate));
    q('#eaModeThemes')._rows=themes;q('#eaModeThemes').innerHTML=renderRank(themes,'or');
    q('#eaModeTimes')._rows=times;q('#eaModeTimes').innerHTML=renderRank(times,'or');
    q('#eaModeBest').innerHTML=best.length?best.slice(0,10).map(x=>`<div class="mail-rank-row" data-best-mail="${attr(x.id)}"><div class="mail-rank-top"><b>${esc(x.subject)}</b><strong>${pct.format(x.openRate||0)}% OR</strong></div><div class="mail-rank-meta">${esc(x.product)} · ${dRu(x.date)} ${esc(x.time||'')} · CTR ${pct.format(x.clickRate||0)}%</div></div>`).join(''):'<div class="empty"><b>Пока нет писем</b></div>';
    q('#mailSegmentTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===currentMode));
  }
  function renderMailAnalyticsFinal(){
    const view=q('#mailanalyticsView');if(!view||!state.data)return;
    if(!view.dataset.finalized){
      view.dataset.finalized='1';
      view.innerHTML=`
        <div class="head"><div><div class="eyebrow">Аналитика рассылок</div><h1>Что работает по каждому сегменту</h1><p>Живые, АКТИВДЕМО и Клики не смешиваем. Продажи считаем только по Живым.</p></div></div>
        <div class="ea-filter"><label>Продукт:</label><select class="control" id="eaProduct"><option value="">Все продукты</option></select><label>Неделя:</label><select class="control" id="eaWeek"><option value="">Все недели</option></select></div>
        <section class="panel" style="margin-bottom:10px"><div class="panelhead"><h2>Темы и материалы, которые продают</h2><p>Только сегмент «Живые» с точной DEMO-связью. Клики и АКТИВДЕМО исключены полностью.</p></div><div class="ea-list" id="eaSelling"></div></section>
        <div id="eaThemes" style="display:none"></div><div class="mail-segment-tabs" id="mailSegmentTabs"><button data-mode="live" class="active">Живые</button><button data-mode="active">АКТИВДЕМО</button><button data-mode="clicks">Клики</button></div>
        <div class="head" style="margin-bottom:10px"><div><div class="eyebrow">Сегмент</div><h1 id="eaModeTitle">Живые</h1></div></div>
        <div class="mail-kpis" id="eaKpis"></div>
        <div class="mail-analytics-grid">
          <section class="panel"><div class="panelhead"><h2>Какие темы работают</h2><p>Рейтинг по OR внутри выбранного сегмента.</p></div><div class="mail-rank" id="eaModeThemes"></div></section>
          <section class="panel"><div class="panelhead"><h2>В какое время отправлять</h2><p>OR/CTR по фактическому часу отправки.</p></div><div class="mail-rank" id="eaModeTimes"></div></section>
          <section class="panel" style="grid-column:1/-1"><div class="panelhead"><h2>Лучшие конкретные письма</h2><p>Можно открыть письмо и посмотреть детали.</p></div><div class="mail-rank" id="eaModeBest"></div></section>
        </div>`;
      q('#mailSegmentTabs').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;currentMode=b.dataset.mode;renderSegmentAnalytics();});
      q('#eaProduct').addEventListener('change',()=>{renderSelling();renderSegmentAnalytics();});
      q('#eaWeek').addEventListener('change',()=>{renderSelling();renderSegmentAnalytics();});
      view.addEventListener('click',e=>{
        const sell=e.target.closest('[data-selling]');if(sell){const x=q('#eaSelling')._rows&&q('#eaSelling')._rows[Number(sell.dataset.selling)];if(x){q('#drawerMeta').textContent=`Живые · ${x.items.length} писем`;q('#drawerTitle').textContent=x.name;q('#drawerBody').innerHTML=`<div class="drawerstats"><div class="dstat"><span>Green</span><b class="g">${fmt.format(x.green)}</b></div><div class="dstat"><span>Yellow</span><b>${fmt.format(x.yellow)}</b></div><div class="dstat"><span>G / 1000</span><b>${pct.format(x.rate)}</b></div></div><div class="dsection"><h3>Конкретные живые письма</h3>${x.items.slice(0,15).map(r=>`<div class="calls-fragment"><b>${esc(r.product)} · ${dRu(r.date)}</b><br>${esc(r.subject)}<br><span style="color:var(--muted)">Green ${fmt.format(r.green||0)} · Yellow ${fmt.format(r.yellow||0)}</span></div>`).join('')}</div>`;q('#drawerBack').classList.add('open');q('#drawer').classList.add('open');}return;}
        const best=e.target.closest('[data-best-mail]');if(best)return openEmail(best.dataset.bestMail);
      });
    }
    const products=uniq((state.data.emails||[]).map(x=>x.product)).sort(),weeks=uniq((state.data.emails||[]).map(x=>x.week).filter(Boolean)).sort((a,b)=>b-a),p=q('#eaProduct').value,w=q('#eaWeek').value;
    q('#eaProduct').innerHTML='<option value="">Все продукты</option>'+products.map(x=>`<option value="${attr(x)}">${esc(x)}</option>`).join('');if(products.includes(p))q('#eaProduct').value=p;
    q('#eaWeek').innerHTML='<option value="">Все недели</option>'+weeks.map(x=>`<option value="${x}">W${x}</option>`).join('');if(weeks.map(String).includes(String(w)))q('#eaWeek').value=w;
    renderSelling();renderSegmentAnalytics();
  }

  const prevRenderAllFinal=renderAll;
  renderAll=function(){prevRenderAllFinal();renderCleanPulse();renderMailAnalyticsFinal();};

  const mailBtn=q('[data-view="mailanalytics"]');if(mailBtn)mailBtn.addEventListener('click',renderMailAnalyticsFinal);
  if(state.data){renderCleanPulse();renderMailAnalyticsFinal();}
})();
</script>
