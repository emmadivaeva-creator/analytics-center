<style>
/* UI refresh v3: warm editorial palette, no blue/purple overload. */
:root{
  --bg:#f6f2eb;
  --card:#fffdf9;
  --ink:#29332f;
  --muted:#7b7a73;
  --line:#e6ded3;
  --nav:#28332f;
  --blue:#2f7d73;
  --blue-soft:#e7f1ee;
  --green:#34775a;
  --green-soft:#e8f2ec;
  --yellow:#a9782d;
  --yellow-soft:#f7efdd;
  --red:#b85f50;
  --red-soft:#f8e9e5;
  --violet:#8b6e62;
  --shadow:0 10px 28px rgba(62,52,43,.07);
}
html,body{background:var(--bg)}
.top{background:var(--nav);box-shadow:0 7px 22px rgba(40,51,47,.16)}
.brandmark{background:linear-gradient(145deg,#4f8f84,#c77d5c)}
.navbtn.active,.navbtn:hover{background:rgba(255,255,255,.12)}
.primary{background:var(--blue)}
.eyebrow{color:var(--blue)}
.control{background:#fbf8f3}
.control:focus{border-color:#91b9b2;box-shadow:0 0 0 3px #e6f0ed}
.week,.panel,.metric,.sumcard,.acard,.tablepanel,.heroitem,.servicebox,.news-card,.calls-card{background:var(--card)}
.tag.active{background:#f4e8e1;color:#965e45}
.tag.news{background:#ece8df;color:#756548}
.ea-product,.news-product{background:#eee8df!important;color:#665f56!important}

/* DEMO pulse: one readable table. */
#weekView #matrix{display:block!important}
.pulse-v3{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.pulse-v3-head,.pulse-v3-row{display:grid;grid-template-columns:minmax(150px,1.35fr) 90px 120px 110px 115px minmax(145px,.9fr);gap:10px;align-items:center}
.pulse-v3-head{padding:10px 14px;background:#eee8df;color:var(--muted);font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.045em}
.pulse-v3-section{padding:7px 14px;background:#f8f4ee;border-top:1px solid #ece4d9;font-size:10px;font-weight:900;color:#53615c}
.pulse-v3-row{padding:12px 14px;border-top:1px solid #eee7dd;font-size:11px}
.pulse-v3-row.risk{box-shadow:inset 4px 0 0 var(--red)}
.pulse-v3-row.wait{box-shadow:inset 4px 0 0 var(--yellow)}
.pulse-v3-row.done{box-shadow:inset 4px 0 0 var(--green)}
.pulse-v3-name b{display:block;font-size:12px}.pulse-v3-name small{display:block;color:var(--muted);margin-top:2px}
.pulse-v3-pct{font-size:22px;font-weight:950;letter-spacing:-.04em}
.pulse-v3-num{font-variant-numeric:tabular-nums}.pulse-v3-num b{font-size:12px}
.pulse-v3-gap{font-weight:850}.pulse-v3-gap.good{color:var(--green)}
.pulse-v3-status{display:inline-flex;font-size:8px;font-weight:900;border-radius:999px;padding:5px 7px;background:#eee9e2;color:#67615a;white-space:nowrap}
.pulse-v3-status.done{background:var(--green-soft);color:var(--green)}
.pulse-v3-status.wait{background:var(--yellow-soft);color:#89631e}
.pulse-v3-status.risk{background:var(--red-soft);color:var(--red)}
.pulse-v3-y{display:block;font-size:8px;color:var(--muted);margin-top:3px}
@media(max-width:920px){.pulse-v3{overflow:auto}.pulse-v3-head,.pulse-v3-row{min-width:800px}}

/* Mail analytics split by audience segment. */
.ea-v3-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.ea-v3-tabs{display:flex;gap:6px;flex-wrap:wrap}
.ea-v3-tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:10px;font-weight:850}
.ea-v3-tabs button.active{background:var(--ink);border-color:var(--ink);color:#fff}
.ea-v3-week{width:150px!important}
.ea-v3-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.ea-v3-kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px}
.ea-v3-kpi span{display:block;font-size:8px;color:var(--muted)}
.ea-v3-kpi b{display:block;font-size:20px;margin-top:2px;letter-spacing:-.03em}
.ea-v3-kpi small{display:block;font-size:8px;color:var(--muted);margin-top:2px}
.ea-v3-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.ea-v3-list{padding:7px 15px 13px}
.ea-v3-row{padding:10px 0;border-bottom:1px solid #eee7dd;cursor:pointer}
.ea-v3-row:last-child{border-bottom:0}
.ea-v3-row:hover b{color:var(--blue)}
.ea-v3-row-top{display:flex;justify-content:space-between;gap:10px}
.ea-v3-row-top b{font-size:11px}.ea-v3-row-top strong{font-size:10px;white-space:nowrap}
.ea-v3-meta{font-size:9px;color:var(--muted);margin-top:3px}
.ea-v3-example{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.35;padding-left:9px;border-left:2px solid #e8dfd4}
.ea-v3-example b{color:var(--ink)}
.ea-v3-note{font-size:9px;color:var(--muted);margin-top:7px}
@media(max-width:900px){.ea-v3-kpis{grid-template-columns:1fr 1fr}.ea-v3-grid{grid-template-columns:1fr}}

/* Small clarity tweaks for the news tab. */
#newsView .head p strong{color:var(--ink)}
</style>

<script>
(function(){
  if(window.__analyticsUiRefreshV3)return;
  window.__analyticsUiRefreshV3=true;

  const q=s=>document.querySelector(s);
  const uniq=a=>[...new Set((a||[]).filter(Boolean))];
  const norm=v=>String(v||'').trim().toLowerCase();

  function campaignText(x){return String(x&&x.campaign||'');}
  function isDigest(x){
    const c=campaignText(x).trim();
    return /^Gosfinansi_letter_news_GF_digest(?:_|$)/i.test(c) ||
      /^letter_news_goszakaz_regular_news_digest(?:_|$)/i.test(c);
  }
  function isClicks(x){
    return norm(x&&x.segment)==='клики' || /(?:^|_)open(?:_|\.|$)/i.test(campaignText(x));
  }
  function isActiveDemo(x){
    return norm(x&&x.segment)==='дожим демо' || /activdemo/i.test(campaignText(x));
  }
  function isLive(x){
    return norm(x&&x.segment)==='живые' && !isActiveDemo(x) && !isClicks(x) && !isDigest(x);
  }
  function segmentMode(x){
    if(isActiveDemo(x))return'active';
    if(isClicks(x))return'clicks';
    if(isLive(x))return'live';
    return'other';
  }

  /* News = only campaigns with explicit digest marker. */
  window.mailType=function(x){
    if(isActiveDemo(x))return'active';
    return isDigest(x)?'news':'direct';
  };

  function pulseRow(fullName,label){
    const p=product(fullName),s=status(p),plan=n(p.plan),green=n(p.green),yellow=n(p.yellow);
    const gap=Math.max(0,plan-green),pr=plan?green/plan*100:0;
    const friday=typeof workday==='function' && workday()===5;
    return `<div class="pulse-v3-row ${s.key}">
      <div class="pulse-v3-name"><b>${esc(label)}</b><small>${esc(fullName.startsWith('ГЗ')?'Госзаказ':'Госфинансы')}</small></div>
      <div class="pulse-v3-pct">${pct.format(pr)}%</div>
      <div class="pulse-v3-num">Green <b>${fmt.format(green)} / ${fmt.format(plan)}</b></div>
      <div class="pulse-v3-gap ${gap?'':'good'}">${gap?'− '+fmt.format(gap):'план закрыт'}</div>
      <div class="pulse-v3-num">${friday?'Y переходящий':'Yellow'} <b>${fmt.format(yellow)}</b></div>
      <div><span class="pulse-v3-status ${s.key}">${esc(s.label)}</span></div>
    </div>`;
  }

  function renderPulseV3(){
    if(!state.data)return;
    const matrix=q('#matrix');if(!matrix)return;
    matrix.innerHTML=`<div class="pulse-v3">
      <div class="pulse-v3-head"><span>Продукт</span><span>План, %</span><span>Green / план</span><span>Остаток</span><span>Yellow</span><span>Решение</span></div>
      <div class="pulse-v3-section">Госзаказ</div>
      ${pulseRow('ГЗ Периодика','Периодика')}
      ${pulseRow('ГЗ Школа','Школа')}
      ${pulseRow('ГЗ Система','Система')}
      <div class="pulse-v3-section">Госфинансы</div>
      ${pulseRow('ГФ Периодика','Периодика')}
      ${pulseRow('ГФ Школа','Школа')}
      ${pulseRow('ГФ Система','Система')}
    </div>`;
    const h=q('#weekView .head h1'),sub=q('#weekView .head p');
    if(h)h.textContent='Пульс DEMO по шести продуктам';
    if(sub)sub.textContent='Одна таблица: выполнение плана, Green, остаток, Yellow и решение. Никаких шести карточек, которые спорят за внимание.';
    const legend=q('#weekView .legend');
    if(legend){
      const friday=typeof workday==='function' && workday()===5;
      legend.innerHTML=friday
        ? '<span><i class="dot g"></i>Green = итог недели</span><span><i class="dot y"></i>Yellow = переходящий потенциал</span>'
        : '<span><i class="dot g"></i>Green = факт</span><span><i class="dot y"></i>Yellow = уже запущенный потенциал</span>';
    }
  }

  const prevRenderWeekV3=window.renderWeek;
  window.renderWeek=function(){
    if(typeof prevRenderWeekV3==='function')prevRenderWeekV3();
    renderPulseV3();
  };

  let currentMode='live';

  function selectedProduct(){const el=q('#eaProduct');return el?el.value:'';}
  function selectedWeek(){const el=q('#eaWeek');return el?el.value:'';}
  function allEmails(){return state.data&&Array.isArray(state.data.emails)?state.data.emails:[];}
  function filteredBase(){
    const p=selectedProduct(),w=selectedWeek();
    return allEmails().filter(x=>(!p||x.product===p)&&(!w||String(x.week)===String(w)));
  }
  function modeRows(){return filteredBase().filter(x=>segmentMode(x)===currentMode);}
  function byKey(rows,keyFn){
    const out={};
    rows.forEach(x=>{const k=keyFn(x);if(!k)return;(out[k]||(out[k]=[])).push(x);});
    return out;
  }
  function groupStats(rows,keyFn){
    return Object.entries(byKey(rows,keyFn)).map(([name,items])=>({
      name,items,count:items.length,
      delivered:items.reduce((s,x)=>s+n(x.delivered),0),
      or:weighted(items,'openRate'),
      ctr:weighted(items,'clickRate'),
      ctor:weighted(items,'ctor'),
      green:items.reduce((s,x)=>s+(x.hasDemoData===true?n(x.green):0),0)
    }));
  }
  function liveSelling(){
    const rows=filteredBase().filter(x=>isLive(x)&&x.hasDemoData===true&&n(x.delivered)>0);
    return Object.entries(byKey(rows,x=>String(x.material||x.subject||'').trim())).map(([name,items])=>{
      const delivered=items.reduce((s,x)=>s+n(x.delivered),0);
      const green=items.reduce((s,x)=>s+n(x.green),0);
      const yellow=items.reduce((s,x)=>s+n(x.yellow),0);
      return{name,items,delivered,green,yellow,rate:delivered?green/delivered*1000:0};
    }).sort((a,b)=>b.rate-a.rate||b.green-a.green);
  }

  function ensureAnalyticsLayout(){
    let view=q('#mailanalyticsView');
    if(!view){
      const app=q('#app');
      if(!app)return null;
      let navBtn=document.querySelector('[data-view="mailanalytics"]');
      if(!navBtn){
        navBtn=document.createElement('button');
        navBtn.className='navbtn';
        navBtn.dataset.view='mailanalytics';
        navBtn.textContent='Аналитика';
        const serviceBtn=document.querySelector('[data-view="service"]');
        if(serviceBtn)serviceBtn.before(navBtn);else{const nav=q('#nav');if(nav)nav.appendChild(navBtn);}
      }
      view=document.createElement('section');
      view.className='view';
      view.id='mailanalyticsView';
      view.innerHTML=`
        <div class="head"><div><div class="eyebrow">Рассылки + DEMO</div><h1>Аналитика рассылок</h1><p>Живые, АКТИВДЕМО и Клики считаются отдельно.</p></div></div>
        <div class="ea-filter"><label>Продукт:</label><select class="control" id="eaProduct"><option value="">Все продукты</option></select></div>
        <div class="ea-grid">
          <section class="panel"><div class="panelhead"><h2>Темы и материалы, которые продают</h2><p>Только Живые + точная DEMO-связь.</p></div><div class="ea-list" id="eaSelling"></div></section>
          <section class="panel"><div class="panelhead"><h2 id="eaModeThemeTitle">Какие темы работают</h2><p id="eaModeThemeSub"></p></div><div class="ea-list" id="eaThemes"></div></section>
        </div>`;
      const serviceView=q('#serviceView');
      if(serviceView)serviceView.before(view);else app.appendChild(view);
    }
    const head=view.querySelector('.head h1');
    const sub=view.querySelector('.head p');
    if(head)head.textContent='Аналитика рассылок';
    if(sub)sub.textContent='Живые, АКТИВДЕМО и Клики считаются отдельно. Они больше не свалены в одну кастрюлю статистики.';

    const filter=q('#eaProduct')&&q('#eaProduct').closest('.ea-filter');
    if(filter && !q('#eaWeek')){
      const week=document.createElement('select');
      week.className='control ea-v3-week';
      week.id='eaWeek';
      week.innerHTML='<option value="">Все недели</option>';
      filter.appendChild(week);
    }

    if(!q('#eaV3Top')){
      const top=document.createElement('div');
      top.className='ea-v3-top';top.id='eaV3Top';
      top.innerHTML=`<div class="ea-v3-tabs" id="eaModeTabs">
        <button type="button" data-mode="live" class="active">Живые</button>
        <button type="button" data-mode="active">АКТИВДЕМО</button>
        <button type="button" data-mode="clicks">Клики</button>
      </div>`;
      const firstGrid=view.querySelector('.ea-grid');
      if(firstGrid)firstGrid.before(top);else view.appendChild(top);
    }

    const panels=view.querySelectorAll('.ea-grid .panel');
    if(panels[0]){
      const h=panels[0].querySelector('.panelhead h2'),p=panels[0].querySelector('.panelhead p');
      if(h)h.textContent='Темы и материалы, которые продают';
      if(p)p.textContent='Только Живые + точная DEMO-связь. АКТИВДЕМО и Клики здесь полностью исключены.';
    }
    if(panels[1]){
      const h=panels[1].querySelector('.panelhead h2'),p=panels[1].querySelector('.panelhead p');
      if(h)h.id='eaModeThemeTitle';
      if(p)p.id='eaModeThemeSub';
    }

    if(!q('#eaV3Kpis')){
      const k=document.createElement('div');k.className='ea-v3-kpis';k.id='eaV3Kpis';
      const firstGrid=view.querySelector('.ea-grid');
      if(firstGrid)firstGrid.before(k);else view.appendChild(k);
    }
    if(!q('#eaV3Extra')){
      const extra=document.createElement('div');extra.className='ea-v3-grid';extra.id='eaV3Extra';
      extra.innerHTML=`<section class="panel"><div class="panelhead"><h2>Когда отправлять</h2><p id="eaModeTimeSub"></p></div><div class="ea-v3-list" id="eaModeTimes"></div></section>
        <section class="panel"><div class="panelhead"><h2>Лучшие конкретные письма</h2><p id="eaModeBestSub"></p></div><div class="ea-v3-list" id="eaModeBest"></div></section>`;
      const firstGrid=view.querySelector('.ea-grid');
      if(firstGrid)firstGrid.after(extra);else view.appendChild(extra);
    }
    return true;
  }

  function renderFilters(){
    const productSel=q('#eaProduct'),weekSel=q('#eaWeek');
    if(productSel){
      const cur=productSel.value,ps=uniq(allEmails().map(x=>x.product)).sort();
      productSel.innerHTML='<option value="">Все продукты</option>'+ps.map(x=>`<option value="${attr(x)}">${esc(x)}</option>`).join('');
      if(ps.includes(cur))productSel.value=cur;
    }
    if(weekSel){
      const cur=weekSel.value,ws=uniq(allEmails().map(x=>x.week).filter(Boolean)).sort((a,b)=>Number(b)-Number(a));
      weekSel.innerHTML='<option value="">Все недели</option>'+ws.map(x=>`<option value="${attr(x)}">W${esc(x)}</option>`).join('');
      if(ws.map(String).includes(String(cur)))weekSel.value=cur;
    }
  }

  function renderSelling(){
    const box=q('#eaSelling');if(!box)return;
    const rows=liveSelling();box._v3rows=rows;
    box.innerHTML=rows.length?rows.slice(0,15).map((x,i)=>`<div class="ea-item" data-v3-selling="${i}">
      <div class="ea-top"><div class="ea-title">${esc(x.name)}</div><div class="ea-score">${pct.format(x.rate)} G / 1000</div></div>
      <div class="ea-meta">ТОЛЬКО ЖИВЫЕ · ${fmt.format(x.green)} Green · ${fmt.format(x.yellow)} Yellow · ${x.items.length} пис. · ${fmt.format(x.delivered)} доставлено</div>
      <div class="ea-products">${uniq(x.items.map(r=>r.product)).map(p=>`<span class="ea-product">${esc(p)}</span>`).join('')}</div>
    </div>`).join(''):'<div class="empty"><b>Нет живых писем с точной DEMO-связью</b>АКТИВДЕМО и Клики сюда не попадают.</div>';
  }

  function rankHtml(groups,metric){
    if(!groups.length)return'<div class="empty"><b>Пока мало данных</b></div>';
    return groups.slice(0,10).map((g,i)=>`<div class="ea-v3-row" data-v3-group="${i}">
      <div class="ea-v3-row-top"><b>${esc(g.name)}</b><strong>${metric==='ctr'?pct.format(g.ctr)+'% CTR':pct.format(g.or)+'% OR'}</strong></div>
      <div class="ea-v3-meta">n=${g.count} · ${fmt.format(g.delivered)} доставлено · OR ${pct.format(g.or)}% · CTR ${pct.format(g.ctr)}% · CTOR ${pct.format(g.ctor)}% · Green ${fmt.format(g.green)}</div>
      <div class="ea-v3-example">${g.items.slice().sort((a,b)=>n(b.openRate)-n(a.openRate)).slice(0,2).map(x=>`<div><b>${esc(x.product)}:</b> ${esc(x.subject)}</div>`).join('')}</div>
    </div>`).join('');
  }

  function renderModeAnalytics(){
    const rows=modeRows();
    const delivered=rows.reduce((s,x)=>s+n(x.delivered),0);
    const green=rows.reduce((s,x)=>s+(x.hasDemoData===true?n(x.green):0),0);
    const gRate=delivered?green/delivered*1000:0;
    const label=currentMode==='live'?'Живые':currentMode==='active'?'АКТИВДЕМО':'Клики';

    const kpiBox=q('#eaV3Kpis');
    if(kpiBox)kpiBox.innerHTML=[
      ['Писем',fmt.format(rows.length),label],
      ['OR',pct.format(weighted(rows,'openRate'))+'%','взвешенный'],
      ['CTR',pct.format(weighted(rows,'clickRate'))+'%','взвешенный'],
      ['Green',fmt.format(green),'только '+label],
      ['G / 1000',pct.format(gRate),'только '+label]
    ].map(x=>`<div class="ea-v3-kpi"><span>${x[0]}</span><b>${x[1]}</b><small>${esc(x[2])}</small></div>`).join('');

    const themeGroups=groupStats(rows,x=>theme(x.subject)).sort((a,b)=>b.or-a.or);
    const timeGroups=groupStats(rows,x=>bucket(x.time)).filter(x=>x.name!=='Время не распознано').sort((a,b)=>b.or-a.or);
    const themeBox=q('#eaThemes');
    if(themeBox){
      themeBox._v3groups=themeGroups;
      themeBox.innerHTML=rankHtml(themeGroups,'or');
    }
    const th=q('#eaModeThemeTitle'),ts=q('#eaModeThemeSub');
    if(th)th.textContent='Какие темы работают · '+label;
    if(ts)ts.textContent='OR, CTR, CTOR и Green только внутри выбранного сегмента.';

    const timeBox=q('#eaModeTimes');
    if(timeBox){
      timeBox._v3groups=timeGroups;
      timeBox.innerHTML=rankHtml(timeGroups,'or');
    }
    const timeSub=q('#eaModeTimeSub');
    if(timeSub)timeSub.textContent='Фактический час отправки только для сегмента «'+label+'».';

    const best=rows.slice().sort((a,b)=>{
      const ar=n(a.delivered)?(a.hasDemoData===true?n(a.green):0)/n(a.delivered)*1000:0;
      const br=n(b.delivered)?(b.hasDemoData===true?n(b.green):0)/n(b.delivered)*1000:0;
      return br-ar || n(b.openRate)-n(a.openRate);
    });
    const bestBox=q('#eaModeBest');
    if(bestBox)bestBox.innerHTML=best.length?best.slice(0,10).map(x=>{
      const gr=n(x.delivered)?(x.hasDemoData===true?n(x.green):0)/n(x.delivered)*1000:0;
      return `<div class="ea-v3-row" data-v3-mail="${attr(x.id)}"><div class="ea-v3-row-top"><b>${esc(x.subject)}</b><strong>${pct.format(gr)} G / 1000</strong></div><div class="ea-v3-meta">${esc(x.product)} · ${dRu(x.date)} ${esc(x.time||'')} · OR ${pct.format(x.openRate||0)}% · CTR ${pct.format(x.clickRate||0)}% · Green ${fmt.format(x.hasDemoData===true?n(x.green):0)}</div></div>`;
    }).join(''):'<div class="empty"><b>Нет писем в этом сегменте</b></div>';
    const bestSub=q('#eaModeBestSub');
    if(bestSub)bestSub.textContent='Сначала собственный Green на 1000, затем OR. Сегменты не смешиваются.';
  }

  function openSelling(index){
    const box=q('#eaSelling'),x=box&&box._v3rows?box._v3rows[Number(index)]:null;if(!x)return;
    const drawerMeta=q('#drawerMeta'),drawerTitle=q('#drawerTitle'),drawerBody=q('#drawerBody'),drawerBack=q('#drawerBack'),drawer=q('#drawer');
    if(!drawerMeta||!drawerTitle||!drawerBody||!drawerBack||!drawer)return;
    drawerMeta.textContent='Живые · '+x.items.length+' писем';
    drawerTitle.textContent=x.name;
    const mails=x.items.slice().sort((a,b)=>n(b.green)-n(a.green)).slice(0,15).map(r=>`<div class="calls-fragment"><b>${esc(r.product)} · ${dRu(r.date)} ${esc(r.time||'')}</b><br>${esc(r.subject)}<br><span style="color:var(--muted)">Green ${fmt.format(r.green||0)} · OR ${pct.format(r.openRate||0)}% · CTR ${pct.format(r.clickRate||0)}%</span></div>`).join('');
    drawerBody.innerHTML=`<div class="drawerstats"><div class="dstat"><span>Green</span><b class="g">${fmt.format(x.green)}</b></div><div class="dstat"><span>Yellow</span><b>${fmt.format(x.yellow)}</b></div><div class="dstat"><span>G / 1000</span><b>${pct.format(x.rate)}</b></div></div><div class="dsection"><h3>Только живые письма</h3>${mails}</div>`;
    drawerBack.classList.add('open');drawer.classList.add('open');
  }

  function openGroup(box,index){
    const g=box&&box._v3groups?box._v3groups[Number(index)]:null;if(!g)return;
    const drawerMeta=q('#drawerMeta'),drawerTitle=q('#drawerTitle'),drawerBody=q('#drawerBody'),drawerBack=q('#drawerBack'),drawer=q('#drawer');
    if(!drawerMeta||!drawerTitle||!drawerBody||!drawerBack||!drawer)return;
    drawerMeta.textContent=(currentMode==='live'?'Живые':currentMode==='active'?'АКТИВДЕМО':'Клики')+' · '+g.count+' писем';
    drawerTitle.textContent=g.name;
    const mails=g.items.slice().sort((a,b)=>n(b.openRate)-n(a.openRate)).slice(0,15).map(r=>`<div class="calls-fragment"><b>${esc(r.product)} · ${dRu(r.date)} ${esc(r.time||'')}</b><br>${esc(r.subject)}<br><span style="color:var(--muted)">OR ${pct.format(r.openRate||0)}% · CTR ${pct.format(r.clickRate||0)}% · Green ${fmt.format(r.hasDemoData===true?n(r.green):0)}</span></div>`).join('');
    drawerBody.innerHTML=`<div class="drawerstats"><div class="dstat"><span>Писем</span><b>${g.count}</b></div><div class="dstat"><span>OR</span><b>${pct.format(g.or)}%</b></div><div class="dstat"><span>CTR</span><b>${pct.format(g.ctr)}%</b></div><div class="dstat"><span>Green</span><b>${fmt.format(g.green)}</b></div></div><div class="dsection"><h3>Конкретные письма</h3>${mails}</div>`;
    drawerBack.classList.add('open');drawer.classList.add('open');
  }

  function renderNewsRule(){
    const sub=q('#newsView .head p');
    if(sub)sub.innerHTML='Здесь учитываются <strong>только кампании, где в campaign есть приписка digest</strong>. OR, CTR, CTOR, темы, время и продукты считаются только по ним.';
  }

  function renderV3(){
    if(!state.data)return;
    if(!ensureAnalyticsLayout())return;
    renderFilters();
    renderSelling();
    renderModeAnalytics();
    renderPulseV3();
    renderNewsRule();
  }

  document.addEventListener('click',function(e){
    const tab=e.target.closest('#eaModeTabs [data-mode]');
    if(tab){
      currentMode=tab.dataset.mode;
      document.querySelectorAll('#eaModeTabs [data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===currentMode));
      renderModeAnalytics();
      return;
    }
    const sell=e.target.closest('[data-v3-selling]');
    if(sell){openSelling(sell.dataset.v3Selling);return;}
    const mail=e.target.closest('[data-v3-mail]');
    if(mail){openEmail(mail.dataset.v3Mail);return;}
    const group=e.target.closest('[data-v3-group]');
    if(group){
      const parent=group.closest('#eaThemes,#eaModeTimes');
      openGroup(parent,group.dataset.v3Group);
    }
  });

  document.addEventListener('change',function(e){
    if(e.target&&['eaProduct','eaWeek'].includes(e.target.id)){
      renderSelling();
      renderModeAnalytics();
    }
  });

  /* Создаём базовую разметку сразу, до первого renderAll. Это защищает старые
     обёртки аналитики, если они ожидают эти элементы раньше загрузки данных. */
  ensureAnalyticsLayout();

  const prevRenderAllV3=window.renderAll;
  window.renderAll=function(){
    /* Ни одна косметическая/аналитическая надстройка больше не должна валить весь сайт. */
    try{
      if(typeof prevRenderAllV3==='function')prevRenderAllV3();
    }catch(err){
      console.error('Предыдущий UI-модуль не отрисовался:',err);
    }
    try{renderV3();}catch(err){console.error('UI refresh v3 не отрисовался:',err);}
  };

  if(state.data){try{renderV3();}catch(err){console.error('UI refresh v3 init:',err);}}
})();
</script>
